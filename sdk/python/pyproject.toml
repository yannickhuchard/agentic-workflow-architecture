[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "awa"
version = "1.0.0"
description = "Python SDK for Agentic Workflow Architecture (AWA)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Yannick HUCHARD" }
]
keywords = ["awa", "agentic", "workflow", "process", "bpmn", "ai-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.27.0",  # the API tests use the framework test client, which needs an HTTP client
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]
ai = [
    "google-generativeai>=0.3.0",
]
web = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
]


[project.scripts]
awa = "awa.cli:main"

[project.urls]
Homepage = "https://github.com/yannickhuchard/agentic-workflow-architecture"
Repository = "https://github.com/yannickhuchard/agentic-workflow-architecture"
Documentation = "https://github.com/yannickhuchard/agentic-workflow-architecture"

[tool.hatch.build.targets.wheel]
packages = ["awa"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

