[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-workflow-architecture"
version = "2.0.0"
description = "Python SDK for Agentic Workflow Architecture (AWA)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Yannick HUCHARD" }
]
keywords = ["awa", "agentic", "workflow", "process", "bpmn", "ai-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.0.0",
    "jsonschema>=4.18.0",  # outcome contracts with an output_schema cannot be checked without it
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.27.0",  # the API tests use the framework test client, which needs an HTTP client
    "jsonschema>=4.18.0",  # outcome contract schemas, and journal events in the conformance tests
    "mypy>=1.0.0",
    "opentelemetry-proto>=1.20.0",  # the telemetry tests decode OTLP protobuf with the OpenTelemetry proto definitions
    "ruff>=0.1.0",
    "psycopg[binary]>=3.1",  # the tests of the shared runtime store, where PostgreSQL is installed
    # The interoperability tests: gRPC tools (17.8), the reference MCP server (17.7), the reference A2A agent
    # and client (28), and the awa: interchange namespace checked against its XSD (27)
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "grpcio-reflection>=1.60.0",
    "protobuf>=4.25.0",
    "mcp>=2.0",
    "a2a-sdk>=1.0,<2",
    "lxml>=5.0",
]
contracts = [
    "jsonschema>=4.18.0",  # checks outcome_contract.output_schema; without it such a contract fails closed
]
ai = [
    "google-generativeai>=0.3.0",
]
postgres = [
    "psycopg[binary]>=3.1",  # the shared runtime store: several hosts on one PostgreSQL database (specification 29)
]
web = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
]
grpc = [
    # Tools with grpc bindings (specification 17.8): calls, .proto files, and server reflection
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "grpcio-reflection>=1.60.0",
    "protobuf>=4.25.0",
]


[project.scripts]
awa = "awa.cli:main"

[project.urls]
Homepage = "https://github.com/yannickhuchard/agentic-workflow-architecture"
Repository = "https://github.com/yannickhuchard/agentic-workflow-architecture"
Documentation = "https://github.com/yannickhuchard/agentic-workflow-architecture"

[tool.hatch.build.targets.wheel]
packages = ["awa"]

# The source distribution carries the package and what describes it: no databases, no test output
[tool.hatch.build.targets.sdist]
include = ["awa", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

