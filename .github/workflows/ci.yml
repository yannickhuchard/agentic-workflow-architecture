name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    name: TypeScript SDK and conformance
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npx vitest run
      # The package as someone installs it: built, packed, installed in an empty project with no database
      # client generated, then loaded both ways and run. A package that only works in this repository fails here.
      - run: npm run build && npm pack --pack-destination "$RUNNER_TEMP"
      - name: Install the packed package in an empty project and use it
        working-directory: ${{ runner.temp }}
        run: |
          mkdir consumer && cd consumer && npm init -y > /dev/null
          npm install ../agentic-workflow-architecture-*.tgz
          node -e "const a = require('agentic-workflow-architecture'); if (typeof a.WorkflowEngine !== 'function' || !require('fs').existsSync(a.view_directory() + '/dashboard.html')) process.exit(1)"
          node --input-type=module -e "import { AwaRuntime, compute_measures } from 'agentic-workflow-architecture'; if (typeof AwaRuntime !== 'function' || typeof compute_measures !== 'function') process.exit(1)"
          npx awa run "$GITHUB_WORKSPACE/examples/claims-settlement/claims-settlement.awa.json" --simulate --outputs "$GITHUB_WORKSPACE/examples/claims-settlement/simulation.json" | grep "status: completed"
          npx awa measures --list | grep -q "journey.completion_rate"

  python:
    name: Python SDK and conformance
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,web]"
      - run: pytest -q
      # The distribution as someone installs it: built, installed in an empty environment, imported and run
      - run: |
          pip install build
          python -m build
          python -m venv "$RUNNER_TEMP/consumer"
          "$RUNNER_TEMP/consumer/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          consumer/bin/python -c "import awa; from awa.runtime.kpi import MEASURES; assert len(MEASURES) > 50"
          consumer/bin/awa measures --list | grep -q "journey.completion_rate"

  conformance-cases:
    name: Conformance cases are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 spec/conformance/generate.py
      - run: git diff --exit-code spec/conformance

  journey-view:
    name: Journey view and measures page in a browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci && npx prisma generate && npm run build
        working-directory: sdk/typescript
      - run: npm install --no-save --no-package-lock playwright@1 && npx playwright install --with-deps chromium
      - run: node examples/claims-journey/make-journeys.mjs && node examples/claims-journey/make-story.mjs
      - run: node tools/visualization/journey.check.mjs
      - run: npm run build:measures && git diff --exit-code ../../tools/visualization/awa-kpis.js
        working-directory: sdk/typescript
      - run: node tools/visualization/dashboard.check.mjs
      - run: node examples/claims-journey/persona-walkthrough.mjs

  mcp-server:
    name: MCP server, widgets and plugin package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            sdk/typescript/package-lock.json
            apps/mcp-server/package-lock.json
      - run: npm ci && npx prisma generate && npm run build
        working-directory: sdk/typescript
      - run: node examples/claims-journey/make-journeys.mjs && node examples/claims-journey/make-story.mjs
      - run: npm ci && npm test && npm run plugin:check
        working-directory: apps/mcp-server
      - run: npm install --no-save --no-package-lock playwright@1 && npx playwright install --with-deps chromium
      - run: NODE_PATH=$PWD/node_modules npm run verify
        working-directory: apps/mcp-server

  guides:
    name: Guides are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 docs/build-guides.py
      - run: git diff --exit-code docs
