openapi: 3.1.0
info:
  title: Agentic Workflow Architecture (AWA) API
  description: |
    REST API for the Agentic Workflow Architecture - the specification standard 
    for AI-native, queryable workflow architecture.

    This document is an informative projection. The JSON Schemas in
    spec/json-schema and docs/specification.md are normative.
  version: 1.1.0
  contact:
    name: Yannick HUCHARD
    url: https://github.com/yannickhuchard/agentic-workflow-architecture
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: https://github.com/yannickhuchard/agentic-workflow-architecture
    description: Project repository
  - url: http://localhost:8080/v1
    description: Local development

tags:
  - name: journeys
    description: Business events, journeys and their records (specification sections 18 and 19)
  - name: runs
    description: Running workflows and reading their execution journal
  - name: workflows
    description: Workflow management
  - name: activities
    description: Activity operations
  - name: contexts
    description: Context management for agent collaboration
  - name: access-rights
    description: Access right declarations
  - name: collections
    description: Workflow collections
  - name: query
    description: Cross-entity querying

paths:
  /workflows:
    get:
      tags: [workflows]
      operationId: list_workflows
      summary: List all workflows
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
        - name: owner_id
          in: query
          schema:
            type: string
            format: uuid
        - name: organization_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of workflows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowList'
    post:
      tags: [workflows]
      operationId: create_workflow
      summary: Create a new workflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowCreate'
      responses:
        '201':
          description: Workflow created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'

  /workflows/{workflow_id}:
    parameters:
      - $ref: '#/components/parameters/workflow_id'
    get:
      tags: [workflows]
      operationId: get_workflow
      summary: Get a workflow by ID
      responses:
        '200':
          description: Workflow details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [workflows]
      operationId: update_workflow
      summary: Update a workflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowUpdate'
      responses:
        '200':
          description: Workflow updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
    delete:
      tags: [workflows]
      operationId: delete_workflow
      summary: Delete a workflow
      responses:
        '204':
          description: Workflow deleted

  /workflows/{workflow_id}/activities:
    parameters:
      - $ref: '#/components/parameters/workflow_id'
    get:
      tags: [activities]
      operationId: list_workflow_activities
      summary: List activities in a workflow
      parameters:
        - name: actor_type
          in: query
          schema:
            $ref: '#/components/schemas/ActorType'
        - name: role_id
          in: query
          schema:
            type: string
            format: uuid
        - name: system_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of activities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityList'

  /workflows/{workflow_id}/activities/{activity_id}:
    parameters:
      - $ref: '#/components/parameters/workflow_id'
      - $ref: '#/components/parameters/activity_id'
    get:
      tags: [activities]
      operationId: get_activity
      summary: Get an activity by ID
      responses:
        '200':
          description: Activity details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'

  /workflows/{workflow_id}/contexts:
    parameters:
      - $ref: '#/components/parameters/workflow_id'
    get:
      tags: [contexts]
      operationId: list_workflow_contexts
      summary: List contexts in a workflow
      parameters:
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/ContextType'
        - name: sync_pattern
          in: query
          schema:
            $ref: '#/components/schemas/SyncPattern'
      responses:
        '200':
          description: List of contexts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextList'
    post:
      tags: [contexts]
      operationId: create_context
      summary: Create a new context
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContextCreate'
      responses:
        '201':
          description: Context created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Context'

  /workflows/{workflow_id}/access-rights:
    parameters:
      - $ref: '#/components/parameters/workflow_id'
    get:
      tags: [access-rights]
      operationId: list_workflow_access_rights
      summary: List all access rights in a workflow
      parameters:
        - name: direction
          in: query
          schema:
            type: string
            enum: [requires, provisions]
        - name: permission
          in: query
          schema:
            $ref: '#/components/schemas/Permission'
        - name: resource_type
          in: query
          schema:
            $ref: '#/components/schemas/ResourceType'
      responses:
        '200':
          description: List of access rights
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRightList'

  /contexts/{context_id}/bindings:
    parameters:
      - name: context_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [contexts]
      operationId: list_context_bindings
      summary: List all bindings for a context
      parameters:
        - name: access_mode
          in: query
          schema:
            $ref: '#/components/schemas/AccessMode'
      responses:
        '200':
          description: List of context bindings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextBindingList'

  /collections:
    get:
      tags: [collections]
      operationId: list_collections
      summary: List all collections
      responses:
        '200':
          description: List of collections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionList'
    post:
      tags: [collections]
      operationId: create_collection
      summary: Create a collection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionCreate'
      responses:
        '201':
          description: Collection created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'

  /collections/{collection_id}/workflows:
    parameters:
      - name: collection_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [collections]
      operationId: list_collection_workflows
      summary: List workflows in a collection
      responses:
        '200':
          description: List of workflows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowList'

  /query/activities:
    get:
      tags: [query]
      operationId: query_activities
      summary: Query activities across all workflows
      parameters:
        - name: actor_type
          in: query
          schema:
            $ref: '#/components/schemas/ActorType'
        - name: system_id
          in: query
          schema:
            type: string
            format: uuid
        - name: role_id
          in: query
          schema:
            type: string
            format: uuid
        - name: has_access_right
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Query results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityList'

  /query/access-rights:
    get:
      tags: [query]
      operationId: query_access_rights
      summary: Query access rights across all workflows
      parameters:
        - name: permission
          in: query
          schema:
            $ref: '#/components/schemas/Permission'
        - name: resource_type
          in: query
          schema:
            $ref: '#/components/schemas/ResourceType'
        - name: resource_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Query results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRightList'

  /workflows/run:
    post:
      tags: [runs]
      summary: Start a run of a workflow
      operationId: startRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filePath]
              properties:
                filePath:
                  type: string
                  description: Path of a .json workflow file inside the server's workflows directory
                input:
                  type: object
                  description: Data the run starts with
                simulate:
                  type: boolean
                  description: Run without calling models, tools or people
      responses:
        '200':
          description: The run was started
          content:
            application/json:
              schema:
                type: object
                properties:
                  runId:
                    type: string
                    format: uuid
                  status:
                    $ref: '#/components/schemas/RunStatus'
        '400':
          description: The file is not an allowed workflow file, or the workflow is invalid

  /workflows/runs/{run_id}:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [runs]
      summary: Status of a run and where its tokens are
      operationId: getRun
      responses:
        '200':
          description: The run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '404':
          $ref: '#/components/responses/NotFound'

  /workflows/runs/{run_id}/workflow:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [runs]
      summary: The workflow definition a run is executing
      operationId: getRunWorkflow
      responses:
        '200':
          description: The workflow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
        '404':
          $ref: '#/components/responses/NotFound'

  /workflows/runs/{run_id}/events:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [runs]
      summary: The execution journal of a run
      description: Events in sequence order. Tool calls appear as tool.invoked, tool.completed and tool.failed events carrying a link to what ran.
      operationId: listRunEvents
      parameters:
        - name: after
          in: query
          description: Return only events whose seq is greater than this
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: Journal events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JournalEvent'
        '404':
          $ref: '#/components/responses/NotFound'

  /workflows/runs/{run_id}/events/stream:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [runs]
      summary: The execution journal of a run, live
      description: |
        Server-Sent Events. Each message has `id` set to the event's seq, `event` set to its
        type, and `data` set to the JournalEvent as JSON. The stream replays from `after`, or
        from the `Last-Event-ID` header, then delivers new events as they are recorded.
      operationId: streamRunEvents
      parameters:
        - name: after
          in: query
          schema:
            type: integer
            minimum: 0
        - name: Last-Event-ID
          in: header
          schema:
            type: integer
      responses:
        '200':
          description: An event stream
          content:
            text/event-stream:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'

  /journeys/definitions:
    post:
      tags: [journeys]
      summary: Register a workflow or a journey
      description: A journey is checked against the workflows it names, so register those first.
      operationId: registerDefinition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/Workflow'
                - $ref: '#/components/schemas/JourneyDefinition'
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  kind: { type: string, enum: [workflow, journey] }
                  id: { type: string, format: uuid }
                  name: { type: string }
        '400':
          description: The document is not a valid workflow or journey

  /journeys:
    get:
      tags: [journeys]
      summary: The journeys, each with its funnel
      operationId: listJourneys
      responses:
        '200':
          description: Journeys
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    name: { type: string }
                    version: { type: string }
                    description: { type: string }
                    stages: { type: array, items: { type: object, properties: { id: { type: string }, name: { type: string } } } }
                    analytics: { $ref: '#/components/schemas/JourneyAnalytics' }

  /journeys/events:
    post:
      tags: [journeys]
      summary: Take in a business event
      description: |
        The event wakes the runs that wait for it, starts the journeys and workflows it triggers and
        moves the journeys it concerns. An `id` already taken in has no further effect: the response
        then has `accepted: false`.
      operationId: publishBusinessEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessEvent'
      responses:
        '202':
          description: What the event did
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResult'
        '400':
          description: The event has no type

  /journeys/tick:
    post:
      tags: [journeys]
      summary: Let time pass
      description: Deadlines that have run out take effect; journeys that have outstayed a stage are marked stalled. A host calls this on a schedule.
      operationId: tick
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                at: { type: string, format: date-time, description: Act as if it were this time. Default now }
      responses:
        '200':
          description: What changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  timed_out_runs: { type: array, items: { type: string, format: uuid } }
                  stalled_journeys: { type: array, items: { type: string, format: uuid } }

  /journeys/instances:
    get:
      tags: [journeys]
      summary: Journey instances
      operationId: listJourneyInstances
      parameters:
        - { name: journey_id, in: query, schema: { type: string, format: uuid } }
        - { name: subject, in: query, description: Only the journeys of this subject key, schema: { type: string } }
        - { name: stalled, in: query, description: Only those that need someone to act, schema: { type: boolean } }
      responses:
        '200':
          description: Instances, without their records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JourneyInstanceSummary'

  /journeys/instances/{instance_id}:
    get:
      tags: [journeys]
      summary: One journey with its whole record and the journal of each of its runs
      operationId: getJourneyInstance
      parameters:
        - { name: instance_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The journey bundle
          content:
            application/json:
              schema:
                type: object
                properties:
                  definition: { $ref: '#/components/schemas/JourneyDefinition' }
                  instance: { type: object, description: The instance with its events }
                  workflows: { type: array, items: { $ref: '#/components/schemas/Workflow' } }
                  runs:
                    type: array
                    items:
                      type: object
                      properties:
                        run_id: { type: string, format: uuid }
                        workflow_id: { type: string, format: uuid }
                        stage_id: { type: string }
                        events: { type: array, items: { $ref: '#/components/schemas/JournalEvent' } }
        '404':
          $ref: '#/components/responses/NotFound'

  /journeys/transitions:
    get:
      tags: [journeys]
      summary: How subjects move from one journey to the next
      operationId: listJourneyTransitions
      responses:
        '200':
          description: For each ordered pair of journeys, how many subjects went from the first to the second
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    from: { type: string, format: uuid }
                    to: { type: string, format: uuid }
                    count: { type: integer }
                    subjects: { type: array, items: { type: string } }

  /journeys/portfolio:
    get:
      tags: [journeys]
      summary: Everything recorded about every journey
      description: The form tools/visualization/journey.html loads. Polling it shows journeys as they progress.
      operationId: getPortfolio
      responses:
        '200':
          description: Definitions, instances, run journals, workflows and transitions
          content:
            application/json:
              schema:
                type: object

  /measures:
    get:
      tags: [journeys]
      summary: The measures of journeys and workflows (specification section 21)
      description: Computed from what was recorded. Each measure is a value and the number it was computed over; the value is null when there is nothing to compute it from.
      operationId: getMeasures
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time }, description: Keep what started at or after this instant }
        - { name: to, in: query, schema: { type: string, format: date-time }, description: Keep what started before this instant }
        - { name: journey_id, in: query, schema: { type: string } }
        - { name: workflow_id, in: query, schema: { type: string } }
        - { name: format, in: query, schema: { type: string, enum: [json, openmetrics, otlp] }, description: openmetrics gives the OpenMetrics text format, for a metrics system to scrape; otlp gives an OTLP/JSON ExportMetricsServiceRequest of gauges (specification 26.12) }
      responses:
        '200':
          description: The report (21.1)
          content:
            application/json:
              schema:
                type: object
                required: [spec_version, as_of, period, totals, journeys, workflows, attention, series]
                properties:
                  spec_version: { type: string }
                  as_of: { type: string, format: date-time }
                  period: { type: object }
                  currency: { type: [string, 'null'] }
                  totals:
                    type: object
                    additionalProperties:
                      type: object
                      required: [value, n]
                      properties:
                        value: { type: [number, 'null'], description: Null when there is nothing to compute it from }
                        n: { type: integer, description: The number of things the value was computed over }
                  journeys: { type: array, items: { type: object } }
                  workflows: { type: array, items: { type: object } }
                  attention: { type: array, items: { type: object } }
                  series: { type: object }
            application/openmetrics-text:
              schema: { type: string }
        '400':
          description: from or to is not an instant

  /measures/definitions:
    get:
      tags: [journeys]
      summary: Every measure with its unit and its rule
      operationId: getMeasureDefinitions
      responses:
        '200':
          description: The measures of section 21
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, name, scope, unit, better, definition]
                  properties:
                    id: { type: string }
                    name: { type: string }
                    scope: { type: string, enum: [journey, stage, workflow, activity] }
                    unit: { type: string, enum: [count, ratio, ms, score, tokens, currency] }
                    better: { type: string, enum: [higher, lower, neither] }
                    definition: { type: string }

  /journeys/runs/{run_id}/tokens/{token_id}/resume:
    post:
      tags: [journeys]
      summary: Complete a task a run of a journey is waiting on a person for
      operationId: resumeJourneyRun
      parameters:
        - $ref: '#/components/parameters/RunId'
        - { name: token_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema: { type: object, description: What the person decided }
      responses:
        '200':
          description: Resumed
        '404':
          description: No such waiting task

components:
  parameters:
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    workflow_id:
      name: workflow_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    activity_id:
      name: activity_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
        maximum: 100
    offset:
      name: offset
      in: query
      schema:
        type: integer
        default: 0

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    BusinessEvent:
      description: A statement that something happened, with the attributes of CloudEvents 1.0 (specification 18.1).
      type: object
      required: [type]
      properties:
        specversion: { type: string, const: '1.0' }
        id: { type: string, description: Generated when absent. The same id twice has no further effect }
        source: { type: string }
        type: { type: string, example: documents.uploaded }
        subject: { type: string }
        time: { type: string, format: date-time }
        data: { type: object }
    PublishResult:
      type: object
      properties:
        event_id: { type: string }
        accepted: { type: boolean }
        resumed_runs: { type: array, items: { type: string, format: uuid } }
        started_runs: { type: array, items: { type: string, format: uuid } }
        journeys: { type: array, items: { type: string, format: uuid } }
    JourneyDefinition:
      description: See spec/json-schema/journey.schema.json, which is normative.
      type: object
      required: [id, name, version, subject, stages]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        version: { type: string }
        subject: { type: object, properties: { name: { type: string }, key: { type: string } } }
        stages: { type: array, items: { type: object } }
        triggers: { type: array, items: { type: object } }
        goals: { type: array, items: { type: object } }
        exits: { type: array, items: { type: object } }
        artefacts: { type: array, items: { type: object } }
        touchpoints: { type: array, items: { type: object } }
        sentiment: { type: object }
    JourneyInstanceSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        journey_id: { type: string, format: uuid }
        subject_key: { type: string }
        status: { type: string, enum: [active, completed, abandoned] }
        stalled: { type: boolean }
        stage_id: { type: string }
        goals_reached: { type: array, items: { type: string } }
        sentiment: { type: number, description: The current estimate of the subject's mood }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
        runs: { type: array, items: { type: object } }
    JourneyAnalytics:
      type: object
      properties:
        total: { type: integer }
        completed: { type: integer }
        abandoned: { type: integer }
        active: { type: integer }
        goals: { type: object, additionalProperties: { type: integer } }
        stages:
          type: array
          items:
            type: object
            properties:
              stage_id: { type: string }
              stage_name: { type: string }
              entered: { type: integer }
              completed: { type: integer }
              active: { type: integer }
              stalled: { type: integer }
              abandoned: { type: integer }
              median_duration_ms: { type: number }
              conversion: { type: number }
    RunStatus:
      type: string
      enum: [running, waiting_human, waiting_event, completed, failed, cancelled]

    Run:
      type: object
      properties:
        runId:
          type: string
          format: uuid
        workflowId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/RunStatus'
        tokens:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              node_id:
                type: string
                format: uuid
              status:
                type: string
                enum: [active, waiting, completed, failed, cancelled, joining, joined]

    JournalEvent:
      description: One entry in the append-only execution journal of a run. See spec/json-schema/journal-event.schema.json.
      type: object
      required: [spec_version, id, run_id, seq, time, type, level, workflow_id, data]
      properties:
        spec_version:
          type: string
        id:
          type: string
          format: uuid
        run_id:
          type: string
          format: uuid
        seq:
          type: integer
          minimum: 1
        time:
          type: string
          format: date-time
        type:
          type: string
          examples: [activity.started, decision.evaluated, tool.invoked, reasoning.recorded]
        level:
          type: string
          enum: [execution, reasoning, meta]
        workflow_id:
          type: string
          format: uuid
        token_id:
          type: string
          format: uuid
        node_id:
          type: string
          format: uuid
        node_name:
          type: string
        attempt:
          type: integer
          minimum: 1
        data:
          type: object

    # Enums
    ActorType:
      type: string
      enum: [human, ai_agent, robot, application]
    
    AccessMode:
      type: string
      enum: [read, write, read_write, subscribe, publish]
    
    SyncPattern:
      type: string
      enum: [shared_state, message_passing, blackboard, event_sourcing]
    
    ContextType:
      type: string
      enum: [document, data, config, state, memory, artifact]
    
    Permission:
      type: string
      enum: [read, write, execute, admin, delete, create]
    
    ResourceType:
      type: string
      enum: [system, api, database, file, service, secret]

    # Core entities
    Workflow:
      type: object
      required: [id, name, version, activities, edges]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        version:
          type: string
        description:
          type: string
        owner_id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        activities:
          type: array
          items:
            $ref: '#/components/schemas/Activity'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/Edge'
        contexts:
          type: array
          items:
            $ref: '#/components/schemas/Context'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    WorkflowCreate:
      type: object
      required: [name, version]
      properties:
        name:
          type: string
        version:
          type: string
        description:
          type: string

    WorkflowUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string

    WorkflowList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Workflow'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    Activity:
      type: object
      required: [id, name, role_id, actor_type]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        role_id:
          type: string
          format: uuid
        actor_type:
          $ref: '#/components/schemas/ActorType'
        system_id:
          type: string
          format: uuid
        machine_id:
          type: string
          format: uuid
        context_bindings:
          type: array
          items:
            $ref: '#/components/schemas/ContextBinding'
        access_rights:
          type: array
          items:
            $ref: '#/components/schemas/AccessRight'
        procedure:
          type: string
        verification:
          type: object
          description: Acceptance criteria. See activity.schema.json, verification_policy.
        retry:
          type: object
          description: Retry policy. See activity.schema.json, retry_policy.
        outcome_contract:
          type: object
          description: Output schema, postconditions, budgets and escalation. See activity.schema.json, outcome_contract.
        join:
          type: string
          enum: [any, all]
          default: any
        compensation:
          type: object
          properties:
            activity_id:
              type: string
              format: uuid
        tools:
          type: array
          description: Callable tools and their bindings. See activity.schema.json, tool.
          items:
            type: object
        knowledge:
          type: object
          description: Knowledge binding. See activity.schema.json.

    ActivityList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Activity'
        total:
          type: integer

    Edge:
      type: object
      required: [id, source_id, target_id]
      properties:
        id:
          type: string
          format: uuid
        source_id:
          type: string
          format: uuid
        target_id:
          type: string
          format: uuid
        condition:
          type: string
        label:
          type: string

    Context:
      type: object
      required: [id, name, type, sync_pattern]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        type:
          $ref: '#/components/schemas/ContextType'
        sync_pattern:
          $ref: '#/components/schemas/SyncPattern'
        visibility:
          type: string
          enum: [private, workflow, collection, global]

    ContextCreate:
      type: object
      required: [name, type, sync_pattern]
      properties:
        name:
          type: string
        type:
          $ref: '#/components/schemas/ContextType'
        sync_pattern:
          $ref: '#/components/schemas/SyncPattern'

    ContextList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Context'
        total:
          type: integer

    ContextBinding:
      type: object
      required: [context_id, access_mode]
      properties:
        id:
          type: string
          format: uuid
        context_id:
          type: string
          format: uuid
        activity_id:
          type: string
          format: uuid
        access_mode:
          $ref: '#/components/schemas/AccessMode'
        required:
          type: boolean
          default: true

    ContextBindingList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContextBinding'
        total:
          type: integer

    AccessRight:
      type: object
      required: [id, name, direction, resource_type, permission]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        activity_id:
          type: string
          format: uuid
        direction:
          type: string
          enum: [requires, provisions]
        resource_type:
          $ref: '#/components/schemas/ResourceType'
        resource_id:
          type: string
        permission:
          $ref: '#/components/schemas/Permission'
        scope:
          type: string

    AccessRightList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AccessRight'
        total:
          type: integer

    Collection:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        workflow_ids:
          type: array
          items:
            type: string
            format: uuid

    CollectionCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string

    CollectionList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Collection'
        total:
          type: integer

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
