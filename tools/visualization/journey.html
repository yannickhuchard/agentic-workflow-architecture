<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AWA Journeys</title>
<!--
  AWA journey view: several journeys, the customers in each, one customer's
  journey as a living service blueprint, and the workflow run behind any part of it.
  Design: docs/ux/journey-visualisation-research.md. Data: journey-story.js, written by
  examples/claims-journey/make-story.mjs. No build step and no network.
-->
<style>
:root { --bg: #0b0f19; --panel: #111827; --card: #1e293b; --line: rgba(255,255,255,.08); --text: #f8fafc; --mute: #9ca3af; --soft: #cbd5e1; --focus: #818cf8; --run: #a855f7; --wait: #fbbf24; --ok: #10b981; --bad: #ff4d4f; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; overflow: hidden; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid #a5b4fc; outline-offset: 2px; }
.hd { font-family: 'Space Grotesk', Inter, system-ui, sans-serif; }
.mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
#fit { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; transform-origin: 0 0; overflow: hidden; background: var(--bg); }

#top { position: absolute; left: 0; top: 0; width: 1440px; height: 56px; padding: 0 24px; display: flex; align-items: center; gap: 12px; background: var(--panel); border-bottom: 1px solid var(--line); z-index: 5; }
.crumb { height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid transparent; background: none; cursor: pointer; font-size: 14px; color: var(--soft); white-space: nowrap; }
.crumb:hover { background: rgba(255,255,255,.07); }
.crumb.on { color: #fff; font-weight: 600; background: rgba(129,140,248,.18); border-color: rgba(129,140,248,.45); }
.sep { color: #64748b; }
.seg-ctl { display: flex; border: 1px solid rgba(255,255,255,.16); border-radius: 9px; overflow: hidden; }
.seg-ctl button { height: 32px; padding: 0 12px; border: 0; border-right: 1px solid rgba(255,255,255,.12); background: none; cursor: pointer; font-size: 13px; color: var(--soft); white-space: nowrap; }
.seg-ctl button:last-child { border-right: 0; }
.seg-ctl button:hover:not(:disabled) { background: rgba(255,255,255,.07); }
.seg-ctl button.on { background: #4338ca; color: #fff; font-weight: 600; }
.seg-ctl button:disabled { opacity: .4; cursor: default; }
.nav { width: 32px; height: 32px; border-radius: 8px; border: 1px solid rgba(255,255,255,.16); background: var(--card); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
.nav:hover { background: #2a3a52; }
.ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* The heights are layers of one stage; moving between them is a zoom into the thing pointed at */
.layer { position: absolute; left: 0; top: 56px; width: 1440px; height: 700px; opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .45s ease, transform .55s cubic-bezier(.2,.7,.2,1), visibility 0s linear .55s; }
.layer.on { opacity: 1; visibility: visible; pointer-events: auto; transition: opacity .45s ease .1s, transform .55s cubic-bezier(.2,.7,.2,1), visibility 0s linear 0s; }
.scene { position: absolute; left: 0; top: 0; width: 100%; height: 100%; transition: opacity .22s ease, transform .22s ease; }
.scene.swap-l { opacity: 0; transform: translateX(-48px); } .scene.swap-r { opacity: 0; transform: translateX(48px); }

/* Shapes: every kind of moment has its own, so colour is never the only cue */
.sh { display: block; width: 100%; height: 100%; }
.k-event { background: #f8fafc; transform: rotate(45deg) scale(.76); border-radius: 2px; }
.k-told { border: 2px solid var(--soft); background: var(--bg); transform: rotate(45deg) scale(.76); border-radius: 2px; }
.k-timeout { border: 2px dashed var(--wait); background: var(--bg); transform: rotate(45deg) scale(.76); }
.k-signal { border: 2px solid var(--soft); background: var(--bg); transform: scale(.6); }
.k-announced { border: 2px solid var(--soft); background: var(--bg); border-radius: 50%; transform: scale(.55); }
.k-partner { background: #38bdf8; border-radius: 2px; transform: scale(.55); }
.k-stage_in { border: 3px solid var(--soft); border-radius: 50%; background: var(--bg); transform: scale(.82); }
.k-stage_out { background: var(--soft); border-radius: 50%; transform: scale(.6); }
.k-goal { background: var(--ok); border-radius: 50%; transform: scale(.56); box-shadow: 0 0 0 4px var(--bg), 0 0 0 7px var(--ok); }
.k-completed { background: var(--ok); border-radius: 50%; transform: scale(.8); box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--ok); }
.k-stalled { background: var(--wait); border-radius: 3px; transform: scale(.86); animation: wait 1.6s ease-in-out infinite; }
.k-abandoned { background: var(--mute); border-radius: 3px; transform: scale(.8); }
.k-run_in { background: var(--run); border-radius: 50%; transform: scale(.45); }
.k-run_out { background: var(--ok); border-radius: 50%; transform: scale(.45); }
.k-run_failed { background: var(--bad); border-radius: 3px; transform: scale(.72); }
.k-run_cancelled { border: 2px solid var(--mute); border-radius: 50%; background: var(--bg); transform: scale(.6); }
.k-model_decision { background: var(--run); transform: rotate(45deg) scale(.76); border-radius: 2px; }
.k-human_wait { border: 3px solid var(--wait); border-radius: 50%; background: var(--bg); transform: scale(.8); animation: wait 1.6s ease-in-out infinite; }
.k-human_done { background: var(--wait); border-radius: 50%; transform: scale(.7); }
.k-undone { border: 2px dashed var(--bad); border-radius: 50%; background: var(--bg); transform: scale(.8); }
@keyframes wait { 50% { opacity: .4; } }
@keyframes glow { 50% { box-shadow: 0 0 0 5px rgba(168,85,247,.12), 0 0 26px rgba(168,85,247,.6); } }
@keyframes capin { from { opacity: 0; transform: translateY(8px); } }

/* Mood, said in a word and a number as well as a colour */
.m-up2, .m-up1 { color: #34d399; } .m-mid { color: var(--soft); } .m-dn1 { color: #fbbf24; } .m-dn2 { color: #ff8a8c; }

/* Atlas: the journeys and the people who pass through them */
.jcard { position: absolute; top: 14px; width: 360px; height: 196px; padding: 14px 16px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 8px; transition: border-color .2s, background-color .2s; }
.jcard:hover { border-color: rgba(129,140,248,.6); background: #162033; }
.stg { display: flex; gap: 4px; flex-wrap: wrap; }
.stg span { font-size: 11px; padding: 2px 7px; border-radius: 5px; background: #27364d; color: #e2e8f0; }
.kv { display: flex; gap: 14px; }
.ct { display: flex; flex-direction: column; gap: 1px; min-width: 50px; }
.jcard .ct span { line-height: 14px; }
.ct b { font-family: 'Space Grotesk', Inter, sans-serif; font-size: 22px; line-height: 24px; font-weight: 600; }
.ct span { font-size: 12px; color: var(--mute); }
.ct.warn b { color: var(--wait); }
.hand { position: absolute; top: 80px; width: 32px; text-align: center; font-size: 12px; color: var(--soft); pointer-events: none; }
.prow { position: absolute; left: 16px; width: 1408px; height: 66px; border-radius: 12px; border: 1px solid transparent; transition: background-color .3s, border-color .3s; pointer-events: none; }
.prow.hot { background: rgba(129,140,248,.09); border-color: rgba(129,140,248,.4); }
.pname { position: absolute; left: 28px; width: 226px; display: flex; flex-direction: column; gap: 2px; pointer-events: none; }
.pcell { position: absolute; width: 360px; height: 58px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255,255,255,.02); cursor: pointer; padding: 0 12px; display: flex; align-items: center; gap: 12px; text-align: left; transition: border-color .2s, background-color .2s; }
.pcell:hover { border-color: rgba(129,140,248,.6); background: rgba(129,140,248,.08); }
.spark { flex: none; width: 150px; height: 40px; overflow: visible; }

/* All journeys of one kind, on calendar time */
.card { position: absolute; top: 20px; height: 104px; padding: 14px 18px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.tick { position: absolute; top: 142px; height: 548px; border-left: 1px solid rgba(255,255,255,.06); padding-left: 6px; font-size: 12px; color: var(--mute); pointer-events: none; }
.lane { position: absolute; left: 16px; width: 1408px; height: 76px; border-radius: 12px; border: 1px solid transparent; background: transparent; cursor: pointer; text-align: left; padding: 9px 12px; display: flex; flex-direction: column; gap: 3px; transition: background-color .3s, border-color .3s; }
.lane:hover { background: rgba(255,255,255,.045); }
.lane.hot { background: rgba(129,140,248,.09); border-color: rgba(129,140,248,.4); }
.ls { font-size: 12px; line-height: 15px; color: var(--mute); width: 222px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.seg { position: absolute; height: 24px; border-radius: 6px; overflow: hidden; white-space: nowrap; font-size: 12px; line-height: 24px; color: #e2e8f0; text-indent: 8px; pointer-events: none; transition: width .6s linear; }
.seg.st0 { background: #27364d; } .seg.st1 { background: #34486a; } .seg.st2 { background: #445b85; }
.seg.stalled { outline: 2px dashed var(--wait); outline-offset: -2px; }
.mk { position: absolute; width: 16px; height: 16px; margin: -8px 0 0 -8px; pointer-events: none; transition: opacity .3s ease .2s, transform .35s cubic-bezier(.3,1.5,.5,1) .2s; }
.mk.off { opacity: 0; transform: scale(.2); transition-delay: 0s; }
.endl { position: absolute; font-size: 12px; font-weight: 600; white-space: nowrap; pointer-events: none; transition: opacity .4s ease .3s; }
.endl.rt { transform: translateX(-100%); }
.endl.off { opacity: 0; transition-delay: 0s; }
.e-completed { color: #34d399; } .e-stalled { color: #fbbf24; } .e-abandoned { color: var(--soft); }
.ph { position: absolute; top: 132px; width: 2px; height: 558px; margin-left: -1px; background: var(--focus); box-shadow: 0 0 12px rgba(129,140,248,.7); pointer-events: none; transition: left .6s linear; }
.phl { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 12px; font-weight: 600; color: #fff; background: #4338ca; padding: 2px 8px; border-radius: 6px; }
.ring { position: absolute; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; border: 2px solid var(--focus); box-shadow: 0 0 18px rgba(129,140,248,.6); pointer-events: none; z-index: 2; transition: left .5s cubic-bezier(.4,0,.2,1), top .5s cubic-bezier(.4,0,.2,1); }
.ring.sm { width: 30px; height: 30px; margin: -15px 0 0 -15px; transition: left .6s linear, top .4s ease; }

/* One journey: the living blueprint */
.band { position: absolute; top: 58px; height: 596px; border-radius: 14px; padding: 4px 12px; font-size: 13px; font-weight: 600; color: #e2e8f0; white-space: nowrap; overflow: hidden; transition: opacity .4s ease; }
.band.b0 { background: rgba(255,255,255,.03); } .band.b1 { background: rgba(255,255,255,.06); }
.band.off { opacity: .28; }
.col { position: absolute; top: 58px; width: 34px; height: 596px; margin-left: -17px; border-radius: 10px; background: rgba(129,140,248,.10); pointer-events: none; transition: left .5s cubic-bezier(.4,0,.2,1); }
.ll { position: absolute; left: 28px; width: 150px; }
.pt { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #e2e8f0; }
.sub { font-size: 12px; line-height: 15px; color: var(--mute); }
.rail { position: absolute; left: 176px; width: 1240px; height: 0; pointer-events: none; }
.rowl { position: absolute; left: 28px; width: 150px; font-size: 11px; line-height: 16px; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g { position: absolute; width: 34px; height: 34px; margin: -17px 0 0 -17px; padding: 8px; border: 0; background: none; cursor: pointer; border-radius: 50%; z-index: 3; transition: opacity .3s ease .45s, transform .35s cubic-bezier(.3,1.5,.5,1) .45s; }
.g.off { opacity: 0; transform: scale(.2); pointer-events: none; transition-delay: 0s; }
.dot { position: absolute; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: #38bdf8; pointer-events: none; transition: opacity .3s ease .55s, transform .3s ease .55s; }
.dot.out { background: var(--bg); border: 2px solid #38bdf8; }
.doc { position: absolute; width: 11px; height: 13px; margin: -7px 0 0 -6px; border-radius: 2px 5px 2px 2px; background: #e2e8f0; pointer-events: auto; transition: opacity .3s ease .6s, transform .3s ease .6s; }
.doc.out { background: var(--bg); border: 2px solid #e2e8f0; }
.dot.off, .doc.off { opacity: 0; transform: scale(.2); transition-delay: 0s; }
.th { position: absolute; background: #94a3b8; pointer-events: none; transition: transform .3s ease, opacity .3s ease; }
.th.h { height: 2px; margin-top: -1px; transform-origin: left center; }
.th.v { width: 2px; margin-left: -1px; transition-delay: .25s; }
.th.v.down { transform-origin: center top; } .th.v.up { transform-origin: center bottom; }
.th.h.off { transform: scaleX(0); transition-delay: 0s; } .th.v.off { transform: scaleY(0); transition-delay: 0s; }
.th.h.time { background: none; background-image: repeating-linear-gradient(90deg, #64748b 0 5px, transparent 5px 10px); }
.th.v.time { background: none; background-image: repeating-linear-gradient(180deg, #64748b 0 5px, transparent 5px 10px); }
.gap { position: absolute; top: 136px; transform: translateX(-50%); font-size: 11px; color: #e2e8f0; padding: 1px 8px; border: 1px dashed #94a3b8; border-radius: 10px; background: var(--bg); white-space: nowrap; pointer-events: none; z-index: 2; transition: opacity .3s ease .1s; }
.gap.off { opacity: 0; transition-delay: 0s; }
.rb { position: absolute; height: 40px; margin-top: -20px; border-radius: 20px; background: var(--card); border: 1.5px solid #475569; cursor: pointer; padding: 0; z-index: 1; transform-origin: left center; transition: opacity .3s ease .4s, transform .45s ease .4s, border-color .3s, background-color .2s; }
.rb:hover { background: #2a3a52; }
.rb.off { opacity: 0; transform: scaleX(.05); pointer-events: none; transition-delay: 0s; }
.rb.r-running { border-color: var(--run); border-style: dashed; } .rb.r-completed { border-color: var(--ok); } .rb.r-failed { border-color: var(--bad); } .rb.r-cancelled { border-color: var(--mute); border-style: dotted; }
.rbl { position: absolute; font-size: 12px; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; border: 1px solid rgba(255,255,255,.22); background: var(--card); padding: 3px 9px; border-radius: 8px; cursor: pointer; z-index: 3; transition: opacity .3s ease .5s; }
.rbl:hover { background: #2a3a52; border-color: var(--focus); }
.rbl.off { opacity: 0; pointer-events: none; transition-delay: 0s; }
.fl { position: absolute; font-size: 12px; font-weight: 600; color: #fff; background: #312e81; border: 1px solid var(--focus); padding: 3px 9px; border-radius: 8px; white-space: nowrap; pointer-events: none; z-index: 4; transition: left .5s cubic-bezier(.4,0,.2,1), top .5s cubic-bezier(.4,0,.2,1); }
.fl.ct { transform: translateX(-50%); } .fl.rt { transform: translateX(-100%) translateX(14px); } .fl.lt { transform: translateX(-14px); }
.chip { height: 28px; padding: 0 12px; border-radius: 14px; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; border: 1px solid rgba(255,255,255,.16); color: var(--soft); white-space: nowrap; transition: background-color .4s, border-color .4s, color .4s, opacity .3s; }
.chip.ok { background: rgba(16,185,129,.16); border-color: var(--ok); color: #6ee7b7; }
.chip.miss { background: rgba(251,191,36,.12); border-color: var(--wait); color: #fcd34d; border-style: dashed; }
.chip.e-completed { background: rgba(16,185,129,.16); border-color: var(--ok); color: #6ee7b7; }
.chip.e-stalled { background: rgba(251,191,36,.14); border-color: var(--wait); color: #fcd34d; }
.chip.e-abandoned { background: rgba(156,163,175,.16); border-color: var(--mute); color: #e5e7eb; }
.chip.hide { opacity: 0; }
.moodline { fill: none; stroke: #e2e8f0; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; transition: stroke-dashoffset .5s ease; }
.mdot { transition: opacity .3s ease .4s; } .mdot.off { opacity: 0; transition-delay: 0s; }
.lg { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--soft); white-space: nowrap; }
.lgi { width: 14px; height: 14px; flex: none; position: relative; }

/* On one customer's journey nothing disappears: what lies after the moment being read is dimmed, so a click inspects and never seems to erase */
#L2 .g.off { opacity: .42; transform: none; pointer-events: auto; }
#L2 .dot.off, #L2 .doc.off { opacity: .25; transform: none; }
#L2 .th.h.off, #L2 .th.v.off { transform: none; opacity: .22; }
#L2 .gap.off { opacity: .4; }
#L2 .rb.off { opacity: .35; transform: none; pointer-events: auto; }
#L2 .rbl.off { opacity: .45; pointer-events: auto; }
#L2 .band.off { opacity: .55; }
.ms { stroke: #e2e8f0; stroke-width: 2; stroke-linecap: round; transition: opacity .3s ease; }
.ms.said { stroke-width: 3.5; } .ms.guess { stroke-dasharray: 5 5; } .ms.off { opacity: .25; }
.md { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; border: 2px solid #e2e8f0; background: var(--bg); padding: 0; cursor: pointer; z-index: 3; transition: opacity .3s ease; }
.md.said { background: #e2e8f0; } .md.off { opacity: .45; }
.nd[data-n] { cursor: pointer; }

.listp { position: absolute; right: 24px; top: 58px; width: 560px; height: 596px; border-radius: 14px; background: var(--panel); border: 1px solid rgba(129,140,248,.5); box-shadow: 0 20px 60px rgba(0,0,0,.6); z-index: 6; display: flex; flex-direction: column; overflow: hidden; }
.listp[hidden] { display: none; }
.listh { flex: none; display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.listb { flex: 1 1 auto; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 2px; }
.ll2 { display: flex; gap: 12px; align-items: baseline; width: 100%; padding: 7px 8px; border-radius: 8px; border: 1px solid transparent; background: none; cursor: pointer; text-align: left; font-size: 13px; line-height: 18px; color: #e2e8f0; }
.ll2:hover { background: rgba(255,255,255,.05); }
.ll2.cur { background: rgba(129,140,248,.14); border-color: rgba(129,140,248,.45); }
.ll2 .w { flex: none; width: 104px; font-size: 12px; color: var(--mute); white-space: nowrap; }
.ll2 .gapl { color: #a5b4fc; font-size: 12px; }

/* One run */
.nd { position: absolute; transition: border-color .25s ease .35s, box-shadow .25s ease .35s, background-color .25s ease .35s, opacity .25s ease .35s; }
.nd.act { border: 1.5px solid #475569; border-radius: 8px; background: var(--card); padding: 7px 9px; display: flex; flex-direction: column; gap: 3px; }
.nd.evt { border: 2px solid #64748b; border-radius: 50%; background: var(--bg); }
.nd.dec { clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); background: #475569; }
.tg { font-size: 10px; line-height: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--mute); }
.nm { font-size: 12px; line-height: 14px; font-weight: 600; }
.ev-in { position: absolute; display: none; }
.m-end { border-width: 5px; }
.m-timer .ev-in { display: block; left: 50%; top: 50%; width: 2px; height: 11px; margin: -11px 0 0 -1px; background: var(--soft); }
.m-wait .ev-in { display: block; inset: 6px; border: 2px dashed var(--soft); border-radius: 50%; }
.m-publish .ev-in { display: block; inset: 10px; background: var(--soft); border-radius: 50%; }
.nd.s1 { border-color: var(--run); box-shadow: 0 0 0 3px rgba(168,85,247,.25), 0 0 16px rgba(168,85,247,.45); animation: glow 1.5s ease-in-out infinite; }
.nd.s2 { border-color: var(--wait); border-style: dashed; box-shadow: 0 0 14px rgba(251,191,36,.3); }
.nd.s3 { border-color: var(--ok); }
.nd.s4 { border-color: var(--bad); background: #3b1d24; box-shadow: 0 0 14px rgba(255,77,79,.35); }
.nd.s5 { border-color: var(--mute); border-style: dotted; opacity: .8; }
.nd.s6 { border-style: dashed; opacity: .55; }
.nd.dec.s1 { background: var(--run); } .nd.dec.s3 { background: var(--ok); } .nd.dec.s4 { background: var(--bad); }
.nd.cur { outline: 2px solid var(--focus); outline-offset: 4px; }
.nl { position: absolute; width: 104px; margin-left: -52px; text-align: center; font-size: 12px; line-height: 14px; color: var(--soft); pointer-events: none; z-index: 2; }
.nl span { background: var(--bg); padding: 0 3px; }
.nl.dl { width: auto; margin-left: 0; text-align: left; white-space: nowrap; }
.eg { position: absolute; background: #334155; pointer-events: none; }
.eg.timeout { background: none; background-image: repeating-linear-gradient(90deg, #7c6a2e 0 5px, transparent 5px 9px); }
.eg.timeout.vv { background-image: repeating-linear-gradient(180deg, #7c6a2e 0 5px, transparent 5px 9px); }
.eg.undo { background: none; background-image: repeating-linear-gradient(180deg, #64748b 0 2px, transparent 2px 6px); }
.ef { position: absolute; inset: 0; background: var(--ok); transition: transform .2s linear; }
.ef.timeout { background: var(--wait); } .ef.undo { background: var(--bad); }
.ef.r { transform-origin: left center; transform: scaleX(0); } .ef.l { transform-origin: right center; transform: scaleX(0); }
.ef.d { transform-origin: center top; transform: scaleY(0); } .ef.u { transform-origin: center bottom; transform: scaleY(0); }
.ef.on { transform: none; }
.tip { position: absolute; width: 0; height: 0; border: 6px solid transparent; pointer-events: none; transition: border-color .2s linear .4s; }
.tip.r { border-left-color: #475569; } .tip.l { border-right-color: #475569; } .tip.d { border-top-color: #475569; } .tip.u { border-bottom-color: #475569; }
.tip.r.on { border-left-color: var(--ok); } .tip.l.on { border-right-color: var(--ok); } .tip.d.on { border-top-color: var(--ok); } .tip.u.on { border-bottom-color: var(--ok); }
.tip.timeout.r.on { border-left-color: var(--wait); } .tip.timeout.d.on { border-top-color: var(--wait); } .tip.timeout.u.on { border-bottom-color: var(--wait); }
.pn { height: 258px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
.tr { display: flex; gap: 10px; align-items: baseline; width: 100%; min-width: 0; padding: 6px 8px; border-radius: 8px; border: 1px solid transparent; background: none; cursor: pointer; text-align: left; font-size: 13px; line-height: 17px; color: var(--mute); }
.tr:hover { background: rgba(255,255,255,.05); }
.tr.cur { color: #fff; background: rgba(129,140,248,.14); border-color: rgba(129,140,248,.45); }
.trw { flex: none; width: 112px; font-size: 12px; color: var(--mute); white-space: nowrap; }
.one { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.clamp2 { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.ev { display: flex; gap: 12px; font-size: 13px; line-height: 17px; }
.evl { flex: none; width: 128px; color: var(--mute); }
.evt2 { color: #e2e8f0; overflow-wrap: anywhere; }
.rawd { font-size: 12px; position: relative; } .rawd summary { cursor: pointer; color: var(--soft); } .rawd pre { margin: 6px 0 0; padding: 8px 10px; border-radius: 8px; background: rgba(255,255,255,.04); border: 1px solid var(--line); white-space: pre-wrap; overflow-wrap: anywhere; font-size: 11px; line-height: 15px; color: #e2e8f0; }
.rawc { position: absolute; right: 0; top: -2px; height: 22px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--soft); cursor: pointer; font-size: 11px; } .rawd:not([open]) .rawc { display: none; }

/* Caption and transport: the sentence is the primary account, the diagram illustrates it */
#bar { position: absolute; left: 0; top: 756px; width: 1440px; height: 144px; padding: 12px 28px 14px; background: var(--panel); border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; z-index: 5; }
#cap { flex: 1 1 auto; min-width: 0; font-size: 19px; line-height: 27px; font-weight: 500; }
#cap.in { animation: capin .4s ease both; }
#facts { flex: none; width: 420px; overflow: hidden; display: flex; flex-direction: column; gap: 2px; font-size: 12px; line-height: 16px; }
#facts div { display: flex; gap: 8px; min-width: 0; } #facts span { flex: none; width: 76px; color: var(--mute); } #facts b { font-weight: 500; color: #e2e8f0; }
.tb { width: 44px; height: 44px; flex: none; border-radius: 10px; border: 1px solid rgba(255,255,255,.16); background: var(--card); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; transition: background-color .2s; }
.tb:hover { background: #2a3a52; }
.tb.pri { width: 60px; background: #4f46e5; border-color: var(--focus); } .tb.pri:hover { background: #6366f1; }
.tb.txt { width: 56px; font-size: 13px; font-weight: 600; }
#scrub { flex: 1 1 auto; min-width: 0; height: 44px; accent-color: var(--focus); cursor: pointer; }
#none[hidden] { display: none; }
#none { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 40px; text-align: center; font-size: 18px; line-height: 28px; color: var(--soft); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="fit">
  <div id="top">
    <div class="hd" style="font-size:18px;font-weight:700;letter-spacing:.06em">AWA</div>
    <div style="width:1px;height:22px;background:rgba(255,255,255,.16)"></div>
    <nav id="crumbs" aria-label="Where you are" style="display:flex;align-items:center;gap:6px"></nav>
    <div style="flex:1"></div>
    <div id="source" style="font-size:12px;color:var(--mute);white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis"></div>
    <button class="crumb" id="b-open" style="border-color:rgba(255,255,255,.16)" title="Open a record: the file written by awa journey export, or by GET /api/v1/journeys/portfolio">Open a record</button>
    <input id="file" type="file" accept=".json,application/json" hidden>
    <div id="switch" class="seg-ctl" role="group" aria-label="Journey"></div>
  </div>
  <div class="layer" id="L0"><div class="scene"></div></div>
  <div class="layer" id="L1"><div class="scene"></div></div>
  <div class="layer" id="L2"><div class="scene"></div></div>
  <div class="layer" id="L3"><div class="scene"></div></div>
  <div id="bar">
    <div style="display:flex;gap:20px;align-items:flex-start;height:58px">
      <div id="when" class="mono" style="flex:none;width:150px;padding-top:4px;font-size:13px;color:#a5b4fc"></div>
      <div id="cap" class="clamp2" aria-live="polite"></div>
      <div id="facts"></div>
    </div>
    <div style="display:flex;gap:10px;align-items:center">
      <button class="tb" id="b-start" aria-label="Back to the beginning"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14"/><path d="M19 5l-9 7 9 7z"/></svg></button>
      <button class="tb" id="b-prev" aria-label="One step back"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="tb pri" id="b-play" aria-label="Tell the story"></button>
      <button class="tb" id="b-next" aria-label="One step forward"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
      <button class="tb txt" id="b-pace" aria-label="Change the pace of the telling">1x</button>
      <input id="scrub" type="range" min="0" max="0" step="1" value="0" aria-label="Position in the story">
      <div id="count" class="mono" style="flex:none;width:76px;text-align:right;font-size:13px;color:#cbd5e1"></div>
    </div>
  </div>
  <div id="none" hidden></div>
</div>
<script src="journey-story-builder.js"></script>
<script src="journey-story.js"></script>
<script>
(() => {
'use strict';
let S = window.AWA_STORY;
const $ = id => document.getElementById(id);
const fit = () => { const k = Math.min(innerWidth / 1440, innerHeight / 900); $('fit').style.transform = `translate(${(innerWidth - 1440 * k) / 2}px, ${(innerHeight - 900 * k) / 2}px) scale(${k})`; };
addEventListener('resize', fit); fit();

const DAY = 86400000, r = Math.round;
/** A value from a record, made safe to stand inside a class name or an attribute */
const tok = s => String(s ?? '').replace(/[^A-Za-z0-9_-]/g, '');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const day = t => new Date(t).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', timeZone: 'UTC' });
const LEVELS = ['atlas', 'journey', 'story', 'run'];
const st = { level: 'atlas', j: 0, i: 0, r: 0, ip: 0, ia: 0, ib: 0, ic: 0, playing: false, fast: false, ox: 720, oy: 350 };
window.AWA_VIEW = st; // for tests and for deep links

const J = () => S.journeys[st.j];
const I = () => J().instances[Math.min(st.i, J().instances.length - 1)];
const R = () => I().runs[Math.min(st.r, I().runs.length - 1)];
const KEY = { atlas: 'ip', journey: 'ia', story: 'ib', run: 'ic' };
const count = () => st.level === 'atlas' ? S.customers.length : st.level === 'journey' ? J().all.length : st.level === 'story' ? I().beats.length : R().steps.length;
const pos = () => Math.min(st[KEY[st.level]], count() - 1);

// Mood in a word, a number and a colour
const moodWord = v => v === null || v === undefined ? '' : v >= 1.5 ? 'delighted' : v >= 0.5 ? 'pleased' : v > -0.5 ? 'neutral' : v > -1.5 ? 'unhappy' : 'upset';
const moodCls = v => v >= 1.5 ? 'm-up2' : v >= 0.5 ? 'm-up1' : v > -0.5 ? 'm-mid' : v > -1.5 ? 'm-dn1' : 'm-dn2';
const signed = v => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(Math.round(v * 10) / 10);
const mood = v => v === null || v === undefined ? '' : `<span class="${moodCls(v)}">${moodWord(v)} (${signed(v)})</span>`;
/** Whether the mood a journey ended on was stated by the customer or inferred by a rule */
const basisOf = inst => { let basis = ''; for (const b of inst.beats) for (const w of b.mood_why || []) basis = w.basis === 'measured' ? 'said' : 'inferred'; return basis; };
const KIND = k => k.charAt(0).toUpperCase() + k.slice(1);

// ---------------------------------------------------------------- geometry
const CX = k => 264 + k * 392;                       // atlas columns
const PY = i => 236 + i * 72;                        // atlas rows
const laneTop = i => 178 + i * 84;                   // calendar lanes
const LY = { world: 180, journey: 240, work: 300 };  // blueprint lanes
const techY = k => 366 + k * 16;
const kindY = (j, k) => 366 + j.technologies.length * 16 + 28 + k * 16;
const moodY = v => 100 - v * 14;
function xsOf(inst) {
    const w = b => 1 + (b.gap ? 1.5 : 0), beats = inst.beats;
    let units = 0; for (let i = 1; i < beats.length; i++) units += w(beats[i]);
    const unit = Math.min(64, 1170 / Math.max(units, 1)), xs = [218];
    for (let i = 1; i < beats.length; i++) xs.push(xs[i - 1] + unit * w(beats[i]));
    return xs.map(r);
}
function beatY(j, b) {
    if (b.lane !== 'tech') return LY[b.lane];
    const k = b.tp ? j.technologies.indexOf(b.tp.technology) : -1;
    return k >= 0 ? techY(k) : LY.journey;
}

// ---------------------------------------------------------------- scenes
const scenes = {};
const built = {};

scenes.atlas = () => {
    let h = `<div style="position:absolute;left:28px;top:20px;width:216px;display:flex;flex-direction:column;gap:8px">
      <div class="hd" style="font-size:22px;line-height:26px;font-weight:600">${S.journeys.length} journeys, ${S.customers.length} customers</div>
      <div class="sub" style="font-size:13px;line-height:18px">Select a journey to see everyone in it, or a cell to follow one customer through it. The line in each cell is that customer&rsquo;s mood: &ldquo;said&rdquo; where they told us, &ldquo;inferred&rdquo; where a rule assumed it.</div></div>`;
    S.journeys.forEach((j, k) => {
        const o = j.outcome;
        h += `<button class="jcard" style="left:${CX(k)}px" data-open-j="${k}" aria-label="See everyone in the ${esc(j.name)} journey">
          <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px"><span class="hd" style="font-size:19px;font-weight:600">${esc(j.name)}</span><span style="font-size:12px">${o.mood === null ? '' : 'ends ' + mood(o.mood)}</span></div>
          <div class="sub clamp2" style="flex:none;height:30px">${esc(j.description)}</div>
          <div class="stg">${j.stages.map(s => `<span>${esc(s.name)}</span>`).join('')}</div>
          <div class="kv"><div class="ct"><b>${o.completed}</b><span>completed</span></div><div class="ct${o.stalled ? ' warn' : ''}"><b>${o.stalled}</b><span>stalled</span></div><div class="ct"><b>${o.left}</b><span>left</span></div>
            ${o.goals.map(g => `<div class="ct"><b>${g.reached}/${j.instances.length}</b><span>${esc(g.name.toLowerCase())}</span></div>`).join('')}</div></button>`;
    });
    for (const t of S.transitions) if (t.to === t.from + 1) h += `<div class="hand" style="left:${CX(t.from) + 360}px">${t.count}<br><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15"/><path d="M14 7l5 5-5 5"/></svg><br>go on</div>`;
    S.customers.forEach((c, i) => {
        h += `<div class="prow" data-p="${i}" style="top:${PY(i) - 4}px"></div>
          <div class="pname" style="top:${PY(i) + 4}px"><span style="font-size:15px;font-weight:600">${esc(c.name)}</span><span class="sub clamp2">${esc(c.persona)}</span></div>`;
        for (const life of c.life) {
            const inst = S.journeys[life.j].instances[life.i], sc = S.journeys[life.j].scale || { min: -2, max: 2 }, n = inst.beats.length;
            const pts = inst.beats.map((b, k) => `${r(4 + k / Math.max(n - 1, 1) * 142)},${r(20 - (b.mood ?? 0) / sc.max * 15)}`).join(' ');
            h += `<button class="pcell" style="left:${CX(life.j)}px;top:${PY(i)}px" data-open-s="${life.j},${life.i}" aria-label="Follow ${esc(c.name)} through ${esc(S.journeys[life.j].name)}">
              <svg class="spark" viewBox="0 0 150 40" aria-hidden="true"><line x1="0" y1="20" x2="150" y2="20" stroke="#334155" stroke-dasharray="3 4"/><polyline points="${pts}" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linejoin="round"/></svg>
              <span style="display:flex;flex-direction:column;gap:2px;min-width:0"><span class="e-${tok(inst.ending.kind)}" style="font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(inst.ending.label)}</span><span style="font-size:12px">${mood(inst.mood_end)}${basisOf(inst) ? ` <span style="color:var(--mute)">&middot; ${basisOf(inst)}</span>` : ''}</span></span></button>`;
        }
    });
    return h;
};

scenes.journey = () => {
    const j = J(), w = r((1104 - (j.stages.length - 1) * 24) / j.stages.length);
    const ax = t => 264 + (Math.min(Math.max(t, j.t0), j.t1) - j.t0) / Math.max(j.t1 - j.t0, 1) * 1104;
    let h = `<div style="position:absolute;left:28px;top:22px;width:216px;display:flex;flex-direction:column;gap:8px">
      <div class="hd" style="font-size:22px;line-height:26px;font-weight:600">${esc(j.name)}</div>
      <div class="sub" style="font-size:13px;line-height:18px">Calendar time, ${day(j.t0)} to ${day(j.t1)}. One lane per customer. Select a lane to follow that customer.</div>
      <div id="asof" style="font-size:13px;font-weight:600;color:#a5b4fc"></div></div>`;
    j.stages.forEach((s, k) => {
        h += `<div class="card" style="left:${264 + k * (w + 24)}px;width:${w}px"><div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px"><span class="hd" style="font-size:17px;font-weight:600">${esc(s.name)}</span><span class="sub">${s.max ? 'given ' + esc(s.max) : ''}</span></div>
          <div class="kv" data-card="${k}"></div></div>`;
    });
    const span = j.t1 - j.t0, step = Math.max(1, Math.ceil(span / DAY / 10)) * DAY;
    for (let t = Math.floor(j.t0 / DAY) * DAY + DAY; t < j.t1; t += step) h += `<div class="tick" style="left:${r(ax(t))}px">${day(t)}</div>`;
    const MARK = { event: 1, timeout: 1, goal: 1, stalled: 1, completed: 1, abandoned: 1, run_failed: 1, model_decision: 1, human_done: 1 };
    j.instances.forEach((c, i) => {
        const top = laneTop(i), stalledBeat = c.beats.find(b => b.kind === 'stalled');
        h += `<button class="lane" data-lane="${i}" style="top:${top}px" aria-label="Follow the journey of ${esc(c.name)}"><span style="font-size:15px;font-weight:600">${esc(c.name)}</span><span class="ls">${esc(c.summary)}</span></button>`;
        c.stages.forEach(sg => { h += `<div class="seg st${sg.stage % 3}" data-from="${sg.from}" data-to="${sg.to === null ? j.t1 : sg.to}" data-open="${sg.to === null ? 1 : 0}" data-stall="${stalledBeat ? stalledBeat.t : ''}" data-name="${esc(j.stages[sg.stage].name)}" style="left:${r(ax(sg.from))}px;top:${top + 22}px;width:0"></div>`; });
        c.beats.forEach(b => { if (MARK[b.kind]) h += `<div class="mk off" data-t="${b.t}" style="left:${r(ax(b.t))}px;top:${top + 34}px"><span class="sh k-${tok(b.kind)}"></span></div>`; });
        const kind = c.ending.kind, endT = kind === 'stalled' && stalledBeat ? stalledBeat.t : c.end, x = ax(endT), missed = c.goals.some(g => !g.reached);
        const txt = esc(c.ending.label) + (kind === 'completed' ? (missed ? ', a goal missed' : ', every goal reached') : '') + (c.mood_end === null ? '' : ' &middot; ' + mood(c.mood_end));
        h += `<div class="endl e-${tok(kind)}${x > 1000 ? ' rt' : ''} off" data-t="${kind === 'active' ? Infinity : endT}" style="left:${r(x)}px;top:${top + 52}px">${txt}</div>`;
    });
    return h + `<div class="ph"><span class="phl"></span></div><div class="ring sm"></div>`;
};

scenes.story = () => {
    const j = J(), c = I(), beats = c.beats, n = beats.length, xs = xsOf(c), person = S.customers[c.c];
    const ys = beats.map(b => beatY(j, b));
    let h = `<div style="position:absolute;left:28px;top:12px;width:1384px;display:flex;align-items:center;gap:10px">
      <div class="hd" style="font-size:22px;font-weight:600;white-space:nowrap" title="${esc((person.persona || '') + ' ' + c.summary)}">${esc(c.name)}</div>
      <button class="crumb" style="border-color:rgba(255,255,255,.16);font-size:12px;height:28px;padding:0 9px" data-person="-1" title="The previous customer in this journey">&lsaquo; previous customer</button>
      <button class="crumb" style="border-color:rgba(255,255,255,.16);font-size:12px;height:28px;padding:0 9px" data-person="1" title="The next customer in this journey">next customer &rsaquo;</button>
      <button class="crumb" style="border-color:var(--focus);color:#fff;font-size:12px;height:28px;padding:0 9px" data-list="toggle" title="The whole story as a dated list you can read from top to bottom">Read as a list</button>
<div style="flex:1 1 auto"></div>
      ${c.mood_from ? `<div class="chip" title="A journey begins at the mood the customer's last one left them in">Arrived ${mood(c.mood_start)} from ${esc(c.mood_from)}</div>` : ''}
      <div class="chip" id="moodchip"></div>
      ${c.goals.map((g, k) => `<div class="chip" data-goal="${k}"></div>`).join('')}
      <div class="chip e-${tok(c.ending.kind)} hide" id="endchip">${esc(c.ending.label)}</div></div>`;
    j.stages.forEach((sg, k) => {
        let first = -1, last = -1; beats.forEach((b, i) => { if (b.stage === k) { if (first < 0) first = i; last = i; } });
        if (first < 0) return;
        const x0 = first === 0 ? xs[0] - 30 : (xs[first - 1] + xs[first]) / 2 + 2, x1 = last === n - 1 ? xs[n - 1] + 30 : (xs[last] + xs[last + 1]) / 2 - 2;
        h += `<div class="band b${k % 2} off" data-b="${first}" style="left:${r(x0)}px;width:${r(x1 - x0)}px">${esc(sg.name)}</div>`;
    });
    h += `<div class="col"></div>`;
    // Lane labels and rails. The journey itself is the line of visibility: customer above, work below.
    const label = (y, title, sub) => `<div class="ll" style="top:${y - 16}px"><div class="pt">${title}</div><div class="sub">${sub}</div></div>`;
    h += label(96, 'Mood', 'solid: said &middot; dashed: inferred') + label(LY.world, 'Customer', 'touchpoints') + label(LY.journey, 'Journey', 'line of visibility') + label(LY.work, 'Workflows', 'the work behind it');
    h += `<div class="rail" style="top:${moodY(0)}px;border-top:1px dashed rgba(255,255,255,.14)"></div><div class="rail" style="top:${LY.world}px;border-top:1px dashed rgba(255,255,255,.10)"></div>
      <div class="rail" style="top:${LY.journey - 1}px;border-top:2px solid #475569"></div><div class="rail" style="top:${LY.work}px;border-top:1px dashed rgba(255,255,255,.10)"></div>
      <div class="rowl" style="top:${moodY(2) - 8}px;left:150px;width:auto;color:#34d399">+2</div><div class="rowl" style="top:${moodY(-2) - 8}px;left:150px;width:auto;color:#ff8a8c">&minus;2</div>`;
    h += `<div class="ll" style="top:${techY(0) - 26}px"><div class="pt">Technology</div></div>`;
    j.technologies.forEach((t, k) => { h += `<div class="rowl" style="top:${techY(k) - 8}px" title="${esc(t)}">${esc(t)}</div><div class="rail" style="top:${techY(k)}px;border-top:1px solid rgba(255,255,255,.05)"></div>`; });
    h += `<div class="ll" style="top:${kindY(j, 0) - 26}px"><div class="pt">Exchanged</div></div>`;
    j.kinds.forEach((t, k) => { h += `<div class="rowl" style="top:${kindY(j, k) - 8}px">${esc(KIND(t))}</div><div class="rail" style="top:${kindY(j, k)}px;border-top:1px solid rgba(255,255,255,.05)"></div>`; });

    // Mood: one line, revealed as the story is told. A filled dot was said by the customer; a hollow one was inferred.
    if (j.scale) {
        const pts = [[xs[0] - 22, moodY(c.mood_start ?? 0)], ...beats.map((b, i) => [xs[i], moodY(b.mood ?? 0)])];
        h += `<svg style="position:absolute;left:0;top:0;width:1440px;height:160px;overflow:visible;pointer-events:none" aria-hidden="true">`;
        beats.forEach((b, i) => {
            const why = b.mood_why || [], basis = why.length ? (why.some(w => w.basis === 'measured') ? ' said' : ' guess') : '';
            h += `<line class="ms${basis} off" data-b="${i}" x1="${pts[i][0]}" y1="${pts[i][1]}" x2="${pts[i + 1][0]}" y2="${pts[i + 1][1]}"/>`;
        });
        h += `</svg>`;
        beats.forEach((b, i) => {
            if (!b.mood_why) return;
            const said = b.mood_why.some(w => w.basis === 'measured');

        if (swap && built[level]) { scene.classList.add(swap > 0 ? 'swap-l' : 'swap-r'); setTimeout(() => { scene.classList.remove('swap-l'); scene.classList.remove('swap-r'); scene.classList.add(swap > 0 ? 'swap-r' : 'swap-l'); fresh(); }, 200); }
        else fresh();
    });
    chrome();
}
const set = (patch, swap) => { Object.assign(st, patch); render(swap); };

// ---------------------------------------------------------------- moving about
function openJourney(j, origin) { set({ level: 'journey', j, ia: 1e9, playing: false, ...(origin || {}) }); }
function openStory(j, i, ib, origin) {
    const inst = S.journeys[j].instances[i];
    set({ level: 'story', j, i, r: 0, ib: ib === undefined ? inst.beats.length - 1 : ib, playing: false, ...(origin || {}) });
}
function openRun(ri) {
    const c = I(), run = c.runs[ri], beat = c.beats[pos()], xs = xsOf(c);
    let ic = 0;
    if (beat.run === ri && beat.step !== undefined) ic = beat.step;
    else if (st.ib >= run.b1) ic = run.steps.length - 1;
    else if (st.ib > run.b0) run.steps.forEach((s, k) => { if (s.t <= beat.t) ic = k; });
    set({ level: 'run', r: ri, ic, playing: false, ox: r((xs[run.b0] + xs[run.b1]) / 2), oy: LY.work });
}
function goLevel(level) {
    const from = LEVELS.indexOf(st.level), to = LEVELS.indexOf(level);
    if (to >= from) return;
    const patch = { level, playing: false };
    if (level === 'journey') {                                  // return to the moment that was being read
        const t = I().beats[Math.min(st.ib, I().beats.length - 1)].t; let ia = 0;
        J().all.forEach((m, k) => { if (m.t <= t) ia = k; });
        if (st.ib >= I().beats.length - 1) ia = 1e9;                // a reader at the end of a story returns to the end of the record
        Object.assign(patch, { ia, ox: 700, oy: laneTop(st.i) + 34 });
    }
    if (level === 'atlas') Object.assign(patch, { ip: from >= 2 ? I().c : st.ip, ox: CX(st.j) + 180, oy: from >= 2 ? PY(I().c) + 30 : 100 });
    set(patch);
}
function switchJourney(j) {
    if (j === st.j) return;
    const dir = j > st.j ? 1 : -1;
    if (st.level === 'story') { const i = S.journeys[j].instances.findIndex(x => x.c === I().c); if (i >= 0) set({ j, i, r: 0, ib: 1e9, playing: false }, dir); }
    else set({ j, ia: 1e9, playing: false }, dir);
}
function switchPerson(d) { const n = J().instances.length; set({ i: (st.i + d + n) % n, r: 0, ib: 1e9, playing: false }, d); }
function move(d, auto) {
    const key = KEY[st.level], i = pos() + d;
    if (i < 0) return;
    if (i >= count()) { set({ playing: false }); return; }
    set({ [key]: i, playing: !!auto });
}
const jump = i => set({ [KEY[st.level]]: Math.max(0, Math.min(i, count() - 1)), playing: false });

document.addEventListener('click', e => {
    const hit = sel => e.target.closest(sel);
    let x;
    if ((x = hit('[data-level]'))) goLevel(x.dataset.level);
    else if ((x = hit('[data-j]'))) switchJourney(+x.dataset.j);
    else if ((x = hit('[data-open-j]'))) openJourney(+x.dataset.openJ, { ox: CX(+x.dataset.openJ) + 180, oy: 106 });
    else if ((x = hit('[data-open-s]'))) { const [j, i] = x.dataset.openS.split(',').map(Number); openStory(j, i, undefined, { ox: CX(j) + 180, oy: PY(S.journeys[j].instances[i].c) + 30 }); }
    else if ((x = hit('[data-lane]'))) { const i = +x.dataset.lane, T = J().all[pos()].t; let ib = 0; J().instances[i].beats.forEach((b, k) => { if (b.t <= T) ib = k; }); openStory(st.j, i, ib, { ox: 700, oy: laneTop(i) + 34 }); }
    else if ((x = hit('[data-list]'))) { const v = x.dataset.list; set(v === 'toggle' ? { list: !st.list } : { listAll: v === 'all' }); }
    else if ((x = hit('[data-person]'))) switchPerson(+x.dataset.person);
    else if ((x = hit('[data-run]'))) openRun(+x.dataset.run);
    else if ((x = hit('[data-beat]'))) jump(+x.dataset.beat);
    else if ((x = hit('[data-step]'))) jump(+x.dataset.step);
    else if ((x = hit('#L3 [data-n]'))) { const n = +x.dataset.n, steps = R().steps; let at = steps.findIndex(s => s.n === n); steps.forEach((s, k) => { if (s.n === n && k <= pos()) at = k; }); if (at >= 0) jump(at); }
    else if ((x = hit('[data-up]'))) goLevel('story');
});
$('b-start').onclick = () => jump(0);
$('b-prev').onclick = () => move(-1);
$('b-next').onclick = () => move(1);
$('b-pace').onclick = () => set({ fast: !st.fast });
$('b-play').onclick = () => {
    if (st.playing) return set({ playing: false });
    const patch = { playing: true };
    if (pos() >= count() - 1) patch[KEY[st.level]] = 0;
    acc = 1500; set(patch);
};
$('scrub').oninput = e => jump(+e.target.value);
document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowRight') { move(1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { move(-1); e.preventDefault(); }
    else if (e.key === 'Escape') { const L = LEVELS.indexOf(st.level); if (L > 0) goLevel(LEVELS[L - 1]); }
});
let acc = 0;
setInterval(() => { if (!st.playing) return; acc += 200 * (st.fast ? 2.4 : 1); if (acc >= 2200) { acc = 0; move(1, true); } }, 200);

// ---------------------------------------------------------------- where the record comes from
const message = text => { $('none').textContent = text; $('none').hidden = !text; };
/** Show a record: a story as the builder makes it, or the portfolio a host exports, which is built into one here */
let shown = false;
function show(data, source, keep, trusted) {
    const prebuilt = data && data.journeys && data.journeys[0] && data.journeys[0].instances[0] && data.journeys[0].instances[0].beats;
    if (prebuilt && !trusted) { message('This file is a prepared story, not a record. Open the record itself: the file written by awa journey export.'); return; }
    const story = prebuilt ? data : window.AWA_build_story(data);
    if (!story.journeys.length) { message('This record holds no journey yet.'); return; }
    // Following a live record: a reader at the latest moment stays at the latest moment
    const following = keep && S && shown && st.level !== 'atlas' && pos() === count() - 1;
    S = story;
    for (const level of LEVELS) delete built[level];
    // A link may name the place, e.g. from the measures page. Following a live host, the place applies to the first
    // record that holds a journey, which may come after records that held none
    if (!keep || !shown) { Object.assign(st, { level: 'atlas', j: 0, i: 0, r: 0, ip: 0, ia: 0, ib: 0, ic: 0, playing: false }); place(); }
    shown = true;
    st.j = Math.min(st.j, S.journeys.length - 1); st.i = Math.min(st.i, J().instances.length - 1);
    if (st.level === 'run' && !I().runs.length) st.level = 'story';
    if (following) st[KEY[st.level]] = count() - 1;
    $('source').textContent = source || '';
    message('');
    render();
}
window.AWA_show = show; // for embedding: a host hands the view a record or a story
async function fetch_record(url) {
    const response = await fetch(url, { headers: { accept: 'application/json' } });
    if (!response.ok) throw new Error(`${url} answered ${response.status}`);
    return response.json();
}
$('b-open').onclick = () => $('file').click();
$('file').onchange = async e => {
    const file = e.target.files[0]; if (!file) return;
    try { show(JSON.parse(await file.text()), file.name); } catch (error) { message(`${file.name} is not a journey record: ${error.message}`); }
};
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', async e => {
    e.preventDefault();
    const file = e.dataTransfer.files[0]; if (!file) return;
    try { show(JSON.parse(await file.text()), file.name); } catch (error) { message(`${file.name} is not a journey record: ${error.message}`); }
});

// A link carries the place: #level/journey/instance/run/position
const place = () => {
    const parts = location.hash.slice(1).split('/');
    if (!S || !LEVELS.includes(parts[0])) return;
    const [level, j, i, rr, p] = [parts[0], ...parts.slice(1).map(Number)];
    if (S.journeys[j] && S.journeys[j].instances[i || 0]) Object.assign(st, { level, j, i: i || 0, r: rr || 0, [KEY[level]]: p || 0 });
};
// ?data=<url> shows that record. ?live=<server> follows a host: its journeys as they progress.
const query = new URLSearchParams(location.search);
if (query.get('live')) {
    const url = query.get('live').replace(/\/$/, '') + '/api/v1/journeys/portfolio';
    let last = '';
    const poll = async () => {
        try {
            const text = JSON.stringify(await fetch_record(url));
            if (text !== last) { const first = !last; last = text; show(JSON.parse(text), `live \u00b7 ${new Date().toLocaleTimeString()}`, !first); }
        } catch (error) { if (!last) message(`Cannot reach ${url}: ${error.message}`); else $('source').textContent = 'live \u00b7 connection lost'; }
    };
    poll(); setInterval(poll, 3000);
} else if (query.get('data')) {
    fetch_record(query.get('data')).then(data => { show(data, query.get('data')); }).catch(error => message(`Cannot load ${query.get('data')}: ${error.message}`));
} else if (S) { place(); $('source').textContent = 'sample: six customers, three journeys'; render(); }
else message('No record loaded. Use "Open a record", drop a file here, or run node examples/claims-journey/make-story.mjs for the sample.');
})();
</script>
