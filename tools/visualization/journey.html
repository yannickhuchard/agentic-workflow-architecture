<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AWA Journeys</title>
<!--
  AWA journey view: several journeys, the customers in each, one customer's
  journey as a living service blueprint, and the workflow run behind any part of it.
  Design: docs/ux/journey-visualisation-research.md. Data: journey-story.js, written by
  examples/claims-journey/make-story.mjs. No build step and no network.
-->
<style>
:root {
  color-scheme: dark;
  /* The palette, in AWA's own colours (brands/awa.DESIGN.md). A brand (?brand=, awa-brand.js) replaces these */
  --bg: #0b0f19; --panel: #111827; --card: #1e293b; --raised: #2a3a52; --text: #f8fafc; --soft: #cbd5e1; --mute: #9ca3af; --faint: #64748b; --stroke: #475569; --edge: #334155;
  --line: rgba(255,255,255,.08); --line-strong: rgba(255,255,255,.16); --hover: rgba(255,255,255,.07); --wash: rgba(255,255,255,.04); --shadow: rgba(0,0,0,.55);
  --accent: #818cf8; --accent-text: #a5b4fc; --accent-fill: #4f46e5; --on-accent: #ffffff; --focus: #818cf8;
  /* The colours that carry meaning: a brand keeps their hue */
  --run: #a855f7; --wait: #fbbf24; --ok: #10b981; --bad: #ff4d4f; --undone: #9ca3af; --sky: #38bdf8;
  --run-ink: #c084fc; --wait-ink: #fcd34d; --ok-ink: #34d399; --bad-ink: #ff8a8c; --undone-ink: #9ca3af; --sky-ink: #38bdf8;
  --font-display: 'Space Grotesk', Inter, system-ui, sans-serif; --font-body: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --radius: 8px; --radius-lg: 12px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-body); overflow: hidden; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; }
.hd { font-family: var(--font-display); }
.mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
#fit { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; transform-origin: 0 0; overflow: hidden; background: var(--bg); }

#top { position: absolute; left: 0; top: 0; width: 1440px; height: 56px; padding: 0 24px; display: flex; align-items: center; gap: 12px; background: var(--panel); border-bottom: 1px solid var(--line); z-index: 5; }
.crumb { height: 32px; padding: 0 12px; border-radius: var(--radius); border: 1px solid transparent; background: none; cursor: pointer; font-size: 14px; color: var(--soft); white-space: nowrap; }
#crumbs .crumb, #crumbs .sep { flex: none; }
#crumbs .crumb.on { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.crumb:hover { background: color-mix(in srgb, var(--text) 7%, transparent); }
.crumb.on { color: var(--text); font-weight: 600; background: color-mix(in srgb, var(--accent) 18%, transparent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
.sep { color: var(--faint); }
.seg-ctl { display: flex; border: 1px solid color-mix(in srgb, var(--text) 16%, transparent); border-radius: 9px; overflow: hidden; }
.seg-ctl button { height: 32px; padding: 0 12px; border: 0; border-right: 1px solid color-mix(in srgb, var(--text) 12%, transparent); background: none; cursor: pointer; font-size: 13px; color: var(--soft); white-space: nowrap; }
.seg-ctl button:last-child { border-right: 0; }
.seg-ctl button:hover:not(:disabled) { background: color-mix(in srgb, var(--text) 7%, transparent); }
.seg-ctl button.on { background: var(--accent-fill); color: var(--on-accent); font-weight: 600; }
.seg-ctl button:disabled { opacity: .4; cursor: default; }
.nav { width: 32px; height: 32px; border-radius: var(--radius); border: 1px solid color-mix(in srgb, var(--text) 16%, transparent); background: var(--card); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
.nav:hover { background: var(--raised); }
.ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* The heights are layers of one stage; moving between them is a zoom into the thing pointed at */
.layer { position: absolute; left: 0; top: 56px; width: 1440px; height: 700px; opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .45s ease, transform .55s cubic-bezier(.2,.7,.2,1), visibility 0s linear .55s; }
.layer.on { opacity: 1; visibility: visible; pointer-events: auto; transition: opacity .45s ease .1s, transform .55s cubic-bezier(.2,.7,.2,1), visibility 0s linear 0s; }
.scene { position: absolute; left: 0; top: 0; width: 100%; height: 100%; transition: opacity .22s ease, transform .22s ease; }
.scene.swap-l { opacity: 0; transform: translateX(-48px); } .scene.swap-r { opacity: 0; transform: translateX(48px); }

/* Shapes: every kind of moment has its own, so colour is never the only cue */
.sh { display: block; width: 100%; height: 100%; }
.k-event { background: var(--text); transform: rotate(45deg) scale(.76); border-radius: 2px; }
.k-told { border: 2px solid var(--soft); background: var(--bg); transform: rotate(45deg) scale(.76); border-radius: 2px; }
.k-timeout { border: 2px dashed var(--wait); background: var(--bg); transform: rotate(45deg) scale(.76); }
.k-signal { border: 2px solid var(--soft); background: var(--bg); transform: scale(.6); }
.k-announced { border: 2px solid var(--soft); background: var(--bg); border-radius: 50%; transform: scale(.55); }
.k-partner { background: var(--sky); border-radius: 2px; transform: scale(.55); }
.k-stage_in { border: 3px solid var(--soft); border-radius: 50%; background: var(--bg); transform: scale(.82); }
.k-stage_out { background: var(--soft); border-radius: 50%; transform: scale(.6); }
.k-goal { background: var(--ok); border-radius: 50%; transform: scale(.56); box-shadow: 0 0 0 4px var(--bg), 0 0 0 7px var(--ok); }
.k-completed { background: var(--ok); border-radius: 50%; transform: scale(.8); box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--ok); }
.k-stalled { background: var(--wait); border-radius: 3px; transform: scale(.86); animation: wait 1.6s ease-in-out infinite; }
.k-abandoned { background: var(--mute); border-radius: 3px; transform: scale(.8); }
.k-run_in { background: var(--run); border-radius: 50%; transform: scale(.45); }
.k-run_out { background: var(--ok); border-radius: 50%; transform: scale(.45); }
.k-run_failed { background: var(--bad); border-radius: 3px; transform: scale(.72); }
.k-run_cancelled { border: 2px solid var(--mute); border-radius: 50%; background: var(--bg); transform: scale(.6); }
.k-model_decision { background: var(--run); transform: rotate(45deg) scale(.76); border-radius: 2px; }
.k-human_wait { border: 3px solid var(--wait); border-radius: 50%; background: var(--bg); transform: scale(.8); animation: wait 1.6s ease-in-out infinite; }
.k-human_done { background: var(--wait); border-radius: 50%; transform: scale(.7); }
.k-undone { border: 2px dashed var(--bad); border-radius: 50%; background: var(--bg); transform: scale(.8); }
@keyframes wait { 50% { opacity: .4; } }
@keyframes glow { 50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--run) 12%, transparent), 0 0 26px color-mix(in srgb, var(--run) 60%, transparent); } }
@keyframes capin { from { opacity: 0; transform: translateY(8px); } }

/* Mood, said in a word and a number as well as a colour */
.m-up2, .m-up1 { color: var(--ok-ink); } .m-mid { color: var(--soft); } .m-dn1 { color: var(--wait-ink); } .m-dn2 { color: var(--bad-ink); }

/* Atlas: the journeys and the people who pass through them */
.jcard { position: absolute; top: 14px; width: 360px; height: 196px; padding: 14px 16px; border-radius: var(--radius-lg); background: var(--panel); border: 1px solid var(--line); cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 8px; transition: border-color .2s, background-color .2s; }
.jcard:hover { border-color: color-mix(in srgb, var(--accent) 60%, transparent); background: color-mix(in srgb, var(--accent) 6%, var(--panel)); }
.stg { display: flex; gap: 4px; flex-wrap: wrap; }
.stg span { font-size: 11px; padding: 2px 7px; border-radius: 5px; background: color-mix(in srgb, var(--accent) 12%, var(--card)); color: var(--text); }
.kv { display: flex; gap: 14px; }
.ct { display: flex; flex-direction: column; gap: 1px; min-width: 50px; }
.jcard .ct span { line-height: 14px; }
.ct b { font-family: var(--font-display); font-size: 22px; line-height: 24px; font-weight: 600; }
.ct span { font-size: 12px; color: var(--mute); }
.ct.warn b { color: var(--wait); }
.ct .gw { font-size: 12px; color: var(--mute); }
.hand { position: absolute; top: 80px; width: 32px; text-align: center; font-size: 12px; color: var(--soft); pointer-events: none; }
.prow { position: absolute; left: 16px; width: 1408px; height: 66px; border-radius: var(--radius-lg); border: 1px solid transparent; transition: background-color .3s, border-color .3s; pointer-events: none; }
.prow.hot { background: color-mix(in srgb, var(--accent) 9%, transparent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
.pname { position: absolute; left: 28px; width: 226px; display: flex; flex-direction: column; gap: 2px; pointer-events: none; }
.pcell { position: absolute; width: 360px; height: 58px; border-radius: 10px; border: 1px solid var(--line); background: color-mix(in srgb, var(--text) 2%, transparent); cursor: pointer; padding: 0 12px; display: flex; align-items: center; gap: 12px; text-align: left; transition: border-color .2s, background-color .2s; }
.pcell:hover { border-color: color-mix(in srgb, var(--accent) 60%, transparent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
.spark { flex: none; width: 150px; height: 40px; overflow: visible; }

/* All journeys of one kind, on calendar time */
.card { position: absolute; top: 20px; height: 104px; padding: 14px 18px; border-radius: var(--radius-lg); background: var(--panel); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
/* A journey of many stages has narrow cards: the name, the time given, and the four counts two by two */
.card.narrow { padding: 9px 8px 8px 10px; gap: 4px; }
.card.narrow .kv { display: grid; grid-template-columns: 1fr 1fr; gap: 1px 4px; }
.card.narrow .kv div { white-space: nowrap; font-size: 11px; line-height: 17px; color: var(--mute); }
.card.narrow .kv b { font-family: var(--font-display); font-size: 15px; font-weight: 600; color: var(--text); margin-right: 4px; }
.card.narrow .kv .warn b { color: var(--wait); }
.tick { position: absolute; top: 142px; height: 548px; border-left: 1px solid color-mix(in srgb, var(--text) 6%, transparent); padding-left: 6px; font-size: 12px; color: var(--mute); pointer-events: none; }
.lane { position: absolute; left: 16px; width: 1408px; height: 76px; border-radius: var(--radius-lg); border: 1px solid transparent; background: transparent; cursor: pointer; text-align: left; padding: 9px 12px; display: flex; flex-direction: column; gap: 3px; transition: background-color .3s, border-color .3s; }
.lane:hover { background: color-mix(in srgb, var(--text) 4.5%, transparent); }
.lane.hot { background: color-mix(in srgb, var(--accent) 9%, transparent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
.ls { font-size: 12px; line-height: 15px; color: var(--mute); width: 222px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.seg { position: absolute; height: 24px; border-radius: 6px; overflow: hidden; white-space: nowrap; font-size: 12px; line-height: 24px; color: var(--text); text-indent: 8px; pointer-events: none; transition: width .6s linear; }
.seg.st0 { background: color-mix(in srgb, var(--accent) 14%, var(--card)); } .seg.st1 { background: color-mix(in srgb, var(--accent) 24%, var(--card)); } .seg.st2 { background: color-mix(in srgb, var(--accent) 34%, var(--card)); }
.seg.stalled { outline: 2px dashed var(--wait); outline-offset: -2px; }
.mk { position: absolute; width: 16px; height: 16px; margin: -8px 0 0 -8px; pointer-events: none; transition: opacity .3s ease .2s, transform .35s cubic-bezier(.3,1.5,.5,1) .2s; }
.mk.off { opacity: 0; transform: scale(.2); transition-delay: 0s; }
.endl { position: absolute; font-size: 12px; font-weight: 600; white-space: nowrap; pointer-events: none; transition: opacity .4s ease .3s; }
.endl.rt { transform: translateX(-100%); }
.endl.off { opacity: 0; transition-delay: 0s; }
.e-completed { color: var(--ok-ink); } .e-stalled { color: var(--wait-ink); } .e-abandoned { color: var(--soft); }
.ph { position: absolute; top: 132px; width: 2px; height: 558px; margin-left: -1px; background: var(--focus); box-shadow: 0 0 12px color-mix(in srgb, var(--accent) 70%, transparent); pointer-events: none; transition: left .6s linear; }
.phl { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 12px; font-weight: 600; color: var(--on-accent); background: var(--accent-fill); padding: 2px 8px; border-radius: 6px; }
.ring { position: absolute; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; border: 2px solid var(--focus); box-shadow: 0 0 18px color-mix(in srgb, var(--accent) 60%, transparent); pointer-events: none; z-index: 2; transition: left .5s cubic-bezier(.4,0,.2,1), top .5s cubic-bezier(.4,0,.2,1); }
.ring.sm { width: 30px; height: 30px; margin: -15px 0 0 -15px; transition: left .6s linear, top .4s ease; }

/* One journey: the living blueprint */
.band { position: absolute; top: 58px; height: 596px; border-radius: var(--radius-lg); transition: opacity .4s ease; }
.band.b0 { background: color-mix(in srgb, var(--text) 3%, transparent); } .band.b1 { background: color-mix(in srgb, var(--text) 6%, transparent); }
.band.off { opacity: .28; }
/* A stage's name, at the top of its band. A band too narrow for it shows a short form; the full name is its accessible name, and shows on hover and focus */
.bhd { position: absolute; top: 58px; height: 26px; padding: 4px 12px; font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; transition: opacity .4s ease; }
.bhd.short { padding: 4px 4px 4px 6px; }
.bhd.off { opacity: .28; }
.bhd .bfull { display: none; }
.bhd.short .bhn { outline: none; cursor: default; }
.bhd.short:hover, .bhd.short:focus-within { overflow: visible; z-index: 6; opacity: 1; }
.bhd.short:hover .bfull, .bhd.short:focus-within .bfull { display: block; position: absolute; left: 0; top: 0; padding: 3px 8px; border-radius: 6px; background: var(--raised); border: 1px solid var(--stroke); box-shadow: 0 4px 14px rgba(0,0,0,.25); }
.bhd.short:focus-within .bfull { outline: 2px solid var(--focus); outline-offset: 1px; }
.col { position: absolute; top: 58px; width: 34px; height: 596px; margin-left: -17px; border-radius: 10px; background: color-mix(in srgb, var(--accent) 10%, transparent); pointer-events: none; transition: left .5s cubic-bezier(.4,0,.2,1); }
.ll { position: absolute; left: 28px; width: 150px; }
.pt { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text); }
.sub { font-size: 12px; line-height: 15px; color: var(--mute); }
.rail { position: absolute; left: 176px; width: 1240px; height: 0; pointer-events: none; }
.rowl { position: absolute; left: 28px; width: 150px; font-size: 11px; line-height: 16px; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g { position: absolute; width: 34px; height: 34px; margin: -17px 0 0 -17px; padding: 8px; border: 0; background: none; cursor: pointer; border-radius: 50%; z-index: 3; transition: opacity .3s ease .45s, transform .35s cubic-bezier(.3,1.5,.5,1) .45s; }
.g.off { opacity: 0; transform: scale(.2); pointer-events: none; transition-delay: 0s; }
.dot { position: absolute; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: var(--sky); pointer-events: none; transition: opacity .3s ease .55s, transform .3s ease .55s; }
.dot.out { background: var(--bg); border: 2px solid var(--sky); }
.doc { position: absolute; width: 11px; height: 13px; margin: -7px 0 0 -6px; border-radius: 2px 5px 2px 2px; background: var(--text); pointer-events: auto; transition: opacity .3s ease .6s, transform .3s ease .6s; }
.doc.out { background: var(--bg); border: 2px solid var(--text); }
.dot.off, .doc.off { opacity: 0; transform: scale(.2); transition-delay: 0s; }
.th { position: absolute; background: var(--mute); pointer-events: none; transition: transform .3s ease, opacity .3s ease; }
.th.h { height: 2px; margin-top: -1px; transform-origin: left center; }
.th.v { width: 2px; margin-left: -1px; transition-delay: .25s; }
.th.v.down { transform-origin: center top; } .th.v.up { transform-origin: center bottom; }
.th.h.off { transform: scaleX(0); transition-delay: 0s; } .th.v.off { transform: scaleY(0); transition-delay: 0s; }
.th.h.time { background: none; background-image: repeating-linear-gradient(90deg, var(--faint) 0 5px, transparent 5px 10px); }
.th.v.time { background: none; background-image: repeating-linear-gradient(180deg, var(--faint) 0 5px, transparent 5px 10px); }
.gap { position: absolute; top: 136px; transform: translateX(-50%); font-size: 11px; color: var(--text); padding: 1px 8px; border: 1px dashed var(--mute); border-radius: 10px; background: var(--bg); white-space: nowrap; pointer-events: none; z-index: 2; transition: opacity .3s ease .1s; }
.gap.off { opacity: 0; transition-delay: 0s; }
.rb { position: absolute; height: 40px; margin-top: -20px; border-radius: 20px; background: var(--card); border: 1.5px solid var(--stroke); cursor: pointer; padding: 0; z-index: 1; transform-origin: left center; transition: opacity .3s ease .4s, transform .45s ease .4s, border-color .3s, background-color .2s; }
.rb:hover { background: var(--raised); }
.rb.off { opacity: 0; transform: scaleX(.05); pointer-events: none; transition-delay: 0s; }
.rb.r-running { border-color: var(--run); border-style: dashed; } .rb.r-completed { border-color: var(--ok); } .rb.r-failed { border-color: var(--bad); } .rb.r-cancelled { border-color: var(--mute); border-style: dotted; }
.rbl { position: absolute; font-size: 12px; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; border: 1px solid color-mix(in srgb, var(--text) 22%, transparent); background: var(--card); padding: 3px 9px; border-radius: var(--radius); cursor: pointer; z-index: 3; transition: opacity .3s ease .5s; }
.rbl:hover { background: var(--raised); border-color: var(--focus); }
.rbl.off { opacity: 0; pointer-events: none; transition-delay: 0s; }
.fl { position: absolute; font-size: 12px; font-weight: 600; color: var(--text); background: color-mix(in srgb, var(--accent) 30%, var(--panel)); border: 1px solid var(--focus); padding: 3px 9px; border-radius: var(--radius); white-space: nowrap; pointer-events: none; z-index: 4; transition: left .5s cubic-bezier(.4,0,.2,1), top .5s cubic-bezier(.4,0,.2,1); }
.fl.ct { transform: translateX(-50%); } .fl.rt { transform: translateX(-100%) translateX(14px); } .fl.lt { transform: translateX(-14px); }
.chip { height: 28px; padding: 0 12px; border-radius: var(--radius-lg); display: inline-flex; align-items: center; gap: 8px; font-size: 13px; border: 1px solid color-mix(in srgb, var(--text) 16%, transparent); color: var(--soft); white-space: nowrap; transition: background-color .4s, border-color .4s, color .4s, opacity .3s; }
.chip.ok { background: color-mix(in srgb, var(--ok) 16%, transparent); border-color: var(--ok); color: var(--ok-ink); }
.chip.miss { background: color-mix(in srgb, var(--wait) 12%, transparent); border-color: var(--wait); color: var(--wait-ink); border-style: dashed; }
.chip.e-completed { background: color-mix(in srgb, var(--ok) 16%, transparent); border-color: var(--ok); color: var(--ok-ink); }
.chip.e-stalled { background: color-mix(in srgb, var(--wait) 14%, transparent); border-color: var(--wait); color: var(--wait-ink); }
.chip.e-abandoned { background: color-mix(in srgb, var(--undone) 16%, transparent); border-color: var(--mute); color: var(--text); }
.chip.hide { opacity: 0; }
.moodline { fill: none; stroke: var(--text); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; transition: stroke-dashoffset .5s ease; }
.mdot { transition: opacity .3s ease .4s; } .mdot.off { opacity: 0; transition-delay: 0s; }
.lg { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--soft); white-space: nowrap; }
.lgi { width: 14px; height: 14px; flex: none; position: relative; }

/* On one customer's journey nothing disappears: what lies after the moment being read is dimmed, so a click inspects and never seems to erase */
#L2 .g.off { opacity: .42; transform: none; pointer-events: auto; }
#L2 .dot.off, #L2 .doc.off { opacity: .25; transform: none; }
#L2 .th.h.off, #L2 .th.v.off { transform: none; opacity: .22; }
#L2 .gap.off { opacity: .4; }
#L2 .rb.off { opacity: .35; transform: none; pointer-events: auto; }
#L2 .rbl.off { opacity: .45; pointer-events: auto; }
#L2 .band.off, #L2 .bhd.off { opacity: .55; }
/* Gap labels that would cover one another: the longest gaps keep theirs, the others are dropped. The gap itself stays drawn */
.gap.drop { display: none; }
.ms { stroke: var(--text); stroke-width: 2; stroke-linecap: round; transition: opacity .3s ease; }
.ms.said { stroke-width: 3.5; } .ms.guess { stroke-dasharray: 5 5; } .ms.off { opacity: .25; }
.md { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; border: 2px solid var(--text); background: var(--bg); padding: 0; cursor: pointer; z-index: 3; transition: opacity .3s ease; }
.md.said { background: var(--text); } .md.off { opacity: .45; }
.nd[data-n] { cursor: pointer; }

.listp { position: absolute; right: 24px; top: 58px; width: 560px; height: 596px; border-radius: var(--radius-lg); background: var(--panel); border: 1px solid color-mix(in srgb, var(--accent) 50%, transparent); box-shadow: 0 20px 60px var(--shadow); z-index: 6; display: flex; flex-direction: column; overflow: hidden; }
.listp[hidden] { display: none; }
.listh { flex: none; display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.listb { flex: 1 1 auto; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 2px; }
.ll2 { display: flex; gap: 12px; align-items: baseline; width: 100%; padding: 7px 8px; border-radius: var(--radius); border: 1px solid transparent; background: none; cursor: pointer; text-align: left; font-size: 13px; line-height: 18px; color: var(--text); }
.ll2:hover { background: color-mix(in srgb, var(--text) 5%, transparent); }

/* One run */
.nd { position: absolute; transition: border-color .25s ease .35s, box-shadow .25s ease .35s, background-color .25s ease .35s, opacity .25s ease .35s; }

.nd.dec { clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); background: var(--stroke); }

/* Three lines of a name fit in the box (the builder widens the boxes of a workflow until they do); a fourth is cut, and the box's title gives the whole name */

.ev-in { position: absolute; display: none; }
.m-end { border-width: 5px; }

.m-publish .ev-in { display: block; inset: 10px; background: var(--soft); border-radius: 50%; }
.nd.s1 { border-color: var(--run); box-shadow: 0 0 0 3px color-mix(in srgb, var(--run) 25%, transparent), 0 0 16px color-mix(in srgb, var(--run) 45%, transparent); animation: glow 1.5s ease-in-out infinite; }
.nd.s2 { border-color: var(--wait); border-style: dashed; box-shadow: 0 0 14px color-mix(in srgb, var(--wait) 30%, transparent); }
.nd.s3 { border-color: var(--ok); }
.nd.s4 { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 16%, var(--card)); box-shadow: 0 0 14px color-mix(in srgb, var(--bad) 35%, transparent); }
.nd.s5 { border-color: var(--mute); border-style: dotted; opacity: .8; }
.nd.s6 { border-style: dashed; opacity: .55; }
.nd.dec.s1 { background: var(--run); } .nd.dec.s3 { background: var(--ok); } .nd.dec.s4 { background: var(--bad); }
.nd.cur { outline: 2px solid var(--focus); outline-offset: 4px; }
.nl { position: absolute; width: 104px; margin-left: -52px; text-align: center; font-size: 12px; line-height: 14px; color: var(--soft); pointer-events: none; z-index: 2; }
.nl span { background: var(--bg); padding: 0 3px; }
.nl.dl { width: auto; margin-left: 0; text-align: left; white-space: nowrap; }
.eg { position: absolute; background: var(--edge); pointer-events: none; }
.eg.timeout { background: none; background-image: repeating-linear-gradient(90deg, color-mix(in srgb, var(--wait) 45%, var(--bg)) 0 5px, transparent 5px 9px); }
.eg.timeout.vv { background-image: repeating-linear-gradient(180deg, color-mix(in srgb, var(--wait) 45%, var(--bg)) 0 5px, transparent 5px 9px); }
.eg.undo { background: none; background-image: repeating-linear-gradient(180deg, var(--faint) 0 2px, transparent 2px 6px); }
.ef { position: absolute; inset: 0; background: var(--ok); transition: transform .2s linear; }
.ef.timeout { background: var(--wait); } .ef.undo { background: var(--bad); }
.ef.r { transform-origin: left center; transform: scaleX(0); } .ef.l { transform-origin: right center; transform: scaleX(0); }
.ef.d { transform-origin: center top; transform: scaleY(0); } .ef.u { transform-origin: center bottom; transform: scaleY(0); }
.ef.on { transform: none; }
.tip { position: absolute; width: 0; height: 0; border: 6px solid transparent; pointer-events: none; transition: border-color .2s linear .4s; }
.tip.r { border-left-color: var(--stroke); } .tip.l { border-right-color: var(--stroke); } .tip.d { border-top-color: var(--stroke); } .tip.u { border-bottom-color: var(--stroke); }
.tip.r.on { border-left-color: var(--ok); } .tip.l.on { border-right-color: var(--ok); } .tip.d.on { border-top-color: var(--ok); } .tip.u.on { border-bottom-color: var(--ok); }
.tip.timeout.r.on { border-left-color: var(--wait); } .tip.timeout.d.on { border-top-color: var(--wait); } .tip.timeout.u.on { border-bottom-color: var(--wait); }
.pn { height: 250px; border-radius: var(--radius-lg); background: var(--panel); border: 1px solid var(--line); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
.tr { display: flex; gap: 10px; align-items: baseline; width: 100%; min-width: 0; padding: 6px 8px; border-radius: var(--radius); border: 1px solid transparent; background: none; cursor: pointer; text-align: left; font-size: 13px; line-height: 17px; color: var(--mute); }

.trw { flex: none; width: 112px; font-size: 12px; color: var(--mute); white-space: nowrap; }
.one { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.clamp2 { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.ev { display: flex; gap: 12px; font-size: 13px; line-height: 17px; }
.evl { flex: none; width: 128px; color: var(--mute); }
.evt2 { color: var(--text); overflow-wrap: anywhere; }
/* A long workflow in bands: one band at a time, the others a click away */
.bchip { height: 32px; padding: 0 12px; border-radius: var(--radius); border: 1px solid var(--line); background: none; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--soft); white-space: nowrap; transition: background-color .3s, border-color .3s, color .3s; }

.gclip { position: absolute; left: 0; width: 1440px; overflow: hidden; }

.gmore button:hover { background: var(--raised); color: var(--text); }
.gband [data-band] { transition: filter .5s ease; }

.bnote { position: absolute; font-size: 11px; line-height: 14px; color: var(--mute); white-space: nowrap; pointer-events: none; }
/* A record that grows is shown again without replaying what was already on screen */
.instant, .instant * { transition: none !important; }
.rawd { font-size: 12px; position: relative; } .rawd summary { cursor: pointer; color: var(--soft); } .rawd pre { margin: 6px 0 0; padding: 8px 10px; border-radius: var(--radius); background: color-mix(in srgb, var(--text) 4%, transparent); border: 1px solid var(--line); white-space: pre-wrap; overflow-wrap: anywhere; font-size: 11px; line-height: 15px; color: var(--text); }
.rawc { position: absolute; right: 0; top: -2px; height: 22px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--soft); cursor: pointer; font-size: 11px; } .rawd:not([open]) .rawc { display: none; }

/* Caption and transport: the sentence is the primary account, the diagram illustrates it */
#bar { position: absolute; left: 0; top: 756px; width: 1440px; height: 144px; padding: 12px 28px 14px; background: var(--panel); border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; z-index: 5; }

#facts div { display: flex; gap: 8px; min-width: 0; } #facts span { flex: none; width: 76px; color: var(--mute); } #facts b { font-weight: 500; color: var(--text); }
.tb { width: 44px; height: 44px; flex: none; border-radius: 10px; border: 1px solid color-mix(in srgb, var(--text) 16%, transparent); background: var(--card); color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; transition: background-color .2s; }
.tb:hover { background: var(--raised); }
.tb.pri { width: 60px; background: var(--accent-fill); color: var(--on-accent); border-color: var(--focus); } .tb.pri:hover { background: color-mix(in srgb, var(--accent-fill) 86%, var(--text)); }
.tb.txt { width: 56px; font-size: 13px; font-weight: 600; }
#scrub { flex: 1 1 auto; min-width: 0; height: 44px; accent-color: var(--focus); cursor: pointer; }

/* The glossary: a panel beside the view, and the words of the view that open it */
.gbtn { display: inline-flex; align-items: center; gap: 8px; border-color: color-mix(in srgb, var(--text) 16%, transparent); }

.gw { background: none; border: 0; padding: 0; margin: 0; cursor: help; text-decoration: underline dotted; text-decoration-color: var(--mute); text-decoration-thickness: 1px; text-underline-offset: 3px; text-align: inherit; }

#gloss { position: absolute; right: 0; top: 0; width: 480px; height: 900px; z-index: 20; display: flex; flex-direction: column; background: var(--panel); border-left: 1px solid color-mix(in srgb, var(--text) 14%, transparent); box-shadow: -24px 0 48px var(--shadow); }

/* ---------------------------------------------------------------- the Recommendations tab (design boards 12 to 12d) */

.b-replay, .b-measured { color: var(--ok-ink); } .b-estimate { color: var(--wait-ink); } .b-pilot { color: var(--soft); } .b-replay-live { color: var(--mute); }
.rstat { font-size: 12px; font-weight: 600; color: var(--ok-ink); }
.rstat.dis { color: var(--mute); }
.avs { display: inline-flex; }
.av { width: 24px; height: 24px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 9.5px; font-weight: 700; color: #fff; background: #475569; border: 2px solid var(--panel); margin-left: -6px; flex: none; }
.av:first-child { margin-left: 0; }
.av.more { background: var(--card); color: var(--soft); }
/* the empty state */
.empty-map { position: absolute; left: 56px; top: 30px; width: 644px; height: 520px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 12px; padding: 0 60px; }
.empty-map .okline { display: flex; align-items: center; gap: 18px; position: relative; padding: 0 12px; margin-bottom: 30px; }
.empty-map .okline::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 1px solid var(--line-strong); }
.empty-map .okline i { position: relative; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--ok-ink); background: var(--bg); display: grid; place-items: center; color: var(--ok-ink); font-style: normal; font-size: 12px; font-weight: 700; }
.empty-map h3 { margin: 0; font-family: var(--font-display); font-size: 24px; font-weight: 600; color: var(--text); }
.empty-map p { margin: 0; font-size: 15px; line-height: 1.5; color: var(--soft); }
.checks { border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--panel); padding: 6px 16px 12px; }
.checks table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.checks td, .checks th { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: left; color: var(--soft); font-weight: 400; }
.checks td:first-child { color: var(--ok-ink); width: 22px; }
.checks td.ck-r { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 12.5px; color: var(--accent-text); width: 50px; }
.checks td.ck-t { text-align: right; color: var(--mute); white-space: nowrap; }
.checks p { margin: 10px 0 0; font-size: 12.5px; color: var(--mute); }
.eacts { display: flex; gap: 10px; margin-top: 28px; }
.ebtn { white-space: nowrap; height: 38px; padding: 0 16px; border-radius: var(--radius); border: 1px solid var(--line-strong); background: transparent; color: var(--text); font-size: 14px; cursor: pointer; }
.ebtn.pri { background: var(--accent-fill); border-color: var(--accent-fill); color: var(--on-accent); font-weight: 600; }
.ebtn:hover { border-color: var(--accent); }
.dashed { margin-top: 30px; border: 1px dashed var(--line-strong); border-radius: var(--radius-lg); padding: 16px 18px; }
.dashed small { display: block; font-size: 11.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); margin-bottom: 6px; }
.dashed b { display: block; font-family: var(--font-display); font-size: 18px; font-weight: 600; margin-bottom: 4px; }
.dashed span { font-size: 13.5px; color: var(--soft); }
.dashed pre { margin: 10px 0 0; font-size: 12.5px; color: var(--soft); white-space: pre-wrap; }
/* the detail panel */
#rpanel { position: absolute; top: 56px; right: 0; width: 620px; height: 844px; z-index: 8; background: var(--panel); border-left: 1px solid var(--line-strong); box-shadow: -24px 0 48px var(--shadow); display: flex; flex-direction: column; transform: translateX(100%); visibility: hidden; transition: transform var(--t-move) var(--ease-out), visibility 0s linear var(--t-move); }
#rpanel.open { transform: none; visibility: visible; transition: transform var(--t-move) var(--ease-out), visibility 0s; }
#rpanel .pin { flex: 1 1 auto; overflow-y: auto; padding: 22px 24px 20px; display: flex; flex-direction: column; gap: 16px; }
#rpanel .rph { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: start; }
#rpanel .rph .big { font: 500 40px/0.9 var(--font-display); color: var(--accent-text); grid-row: span 2; }
#rpanel h2 { margin: 0; font-family: var(--font-display); font-size: 22px; line-height: 1.25; font-weight: 600; }
#rpanel .px { width: 34px; height: 34px; border-radius: var(--radius); border: 1px solid var(--line-strong); background: none; color: var(--soft); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
#rpanel .tags { display: flex; gap: 8px; flex-wrap: wrap; grid-column: 2; }
#rpanel .tag { height: 26px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line-strong); font-size: 13px; color: var(--soft); display: inline-flex; align-items: center; gap: 6px; }
#rpanel .tag svg { width: 10px; height: 10px; }
#rpanel p.find { margin: 0; font-size: 14.5px; line-height: 1.5; color: var(--soft); }
#rpanel h3 { margin: 0 0 8px; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); }
.why { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.why div { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 9px 11px; font-size: 13px; line-height: 1.4; color: var(--soft); }
.why b { display: block; font: 500 12px ui-monospace, 'SF Mono', Menlo, Consolas, monospace; color: var(--accent-text); margin-bottom: 3px; }
.why strong { display: block; color: var(--text); font-weight: 600; margin-bottom: 2px; }
.why small { display: block; font-size: 12px; color: var(--mute); margin-top: 3px; }
.who { list-style: none; margin: 0; padding: 0; }
.who li { display: grid; grid-template-columns: 28px 84px minmax(0, 1fr) 210px; gap: 10px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); font-size: 14px; }
.who li.nobar { grid-template-columns: 28px minmax(0, 1fr) auto; }
.who .bar { position: relative; height: 12px; border-radius: 3px; background: var(--card); }
.who .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--accent); }
.who .bar i.long { background: var(--wait); }
.who .bar u { position: absolute; top: -4px; bottom: -4px; border-left: 1.5px dashed var(--text); }
.who .links { display: flex; gap: 8px; align-items: center; justify-content: flex-end; white-space: nowrap; font-size: 13px; }
.who .links b { font-weight: 600; min-width: 34px; text-align: right; }
.lnk { background: none; border: 0; padding: 2px 3px; color: var(--accent-text); cursor: pointer; font-size: 13px; border-radius: 4px; }
.lnk:hover { text-decoration: underline; }
.lnk.mono { font-size: 12.5px; }
.hint { margin: 6px 0 0; font-size: 12.5px; line-height: 1.45; color: var(--mute); }
.effect { border: 1px solid var(--line-strong); border-radius: 12px; padding: 12px 14px; }
.effect.m-estimate { border-color: color-mix(in srgb, var(--wait-ink) 70%, transparent); background: color-mix(in srgb, var(--wait) 6%, transparent); }
.effect.m-replay, .effect.m-measured { border-color: color-mix(in srgb, var(--ok-ink) 70%, transparent); background: color-mix(in srgb, var(--ok) 6%, transparent); }
.effect .eh { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.effect h3 { margin: 0; }
.effect.m-estimate h3 { color: var(--wait-ink); } .effect.m-replay h3, .effect.m-measured h3 { color: var(--ok-ink); }
.effect p { margin: 8px 0 0; font-size: 14px; line-height: 1.5; color: var(--text); }
.tog { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 9px; overflow: hidden; }
.tog button { white-space: nowrap; height: 30px; padding: 0 12px; border: 0; background: none; cursor: pointer; color: var(--soft); font-size: 13px; }
.tog button[aria-pressed="true"] { background: var(--accent-fill); color: var(--on-accent); font-weight: 600; }
.nums { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 14px; margin-top: 10px; }
.nums div { border-top: 1px solid var(--line); padding-top: 6px; font-size: 12.5px; color: var(--soft); }
.nums b { display: block; font: 600 20px var(--font-display); color: var(--text); transition: color var(--t-move) var(--ease-std), transform var(--t-move) var(--ease-out); }
.nums b.chg { color: var(--ok-ink); }
.nums b.pulse { transform: translateY(-3px); }
.ract p { margin: 0; font-size: 14px; line-height: 1.5; color: var(--soft); }
.ract b { color: var(--text); font-weight: 600; }
.ractions { flex: none; display: flex; gap: 10px; align-items: center; padding: 12px 24px; border-top: 1px solid var(--line); background: var(--panel); }
.ractions select { height: 36px; border-radius: var(--radius); border: 1px solid var(--line-strong); background: var(--bg); color: var(--text); padding: 0 10px; font: inherit; font-size: 14px; }
.ractions .esc { margin-left: auto; font-size: 12.5px; color: var(--mute); white-space: nowrap; }
.ractions select { max-width: 190px; }
.ebtn.ok[aria-pressed="true"] { border-color: var(--ok-ink); color: var(--ok-ink); }
/* before and after, on the run */
.cf { position: relative; }
.cf .cfh { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; }
.cf .cfh h2 { white-space: nowrap; margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); }
.cf .cfh span { font-size: 12.5px; color: var(--mute); }
.cf .cfh .tog { flex: none; }
.cf .cfh .tog span { font-size: inherit; color: inherit; }
.cf .rlane { margin: 10px 0 2px; font-size: 13.5px; color: var(--soft); }
.cf .rlane b { color: var(--text); font-weight: 600; }
.cf .sect { margin-top: 14px; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); }
.cf .sect.go { color: var(--ok-ink); }
.cf .row { position: relative; height: 74px; }
.cf .box { position: absolute; top: 0; width: 190px; height: 70px; border-radius: 6px; padding: 7px 10px; border: 1.5px solid var(--line-strong); background: var(--card); font-size: 12px; line-height: 1.3; color: var(--soft); transition: transform var(--t-move) var(--ease-out), opacity var(--t-move) var(--ease-std), border-color var(--t-move) var(--ease-std); }
.cf .box small { display: block; font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--mute); }
.cf .box b { display: block; color: var(--text); font-weight: 600; font-size: 12.5px; }
.cf .box.bad { border-color: var(--bad-ink); }
.cf .box.ok { border-color: var(--ok-ink); }
.cf .box.ghost { border-style: dashed; border-color: var(--line-strong); background: transparent; color: var(--mute); }
.cf .arrow { position: absolute; top: 34px; height: 0; border-top: 1.5px solid var(--mute); transition: transform var(--t-move) var(--ease-out), opacity var(--t-move) var(--ease-std); }
.cf .arrow.bad { border-color: var(--bad-ink); } .cf .arrow.ok { border-color: var(--ok-ink); }
.cf .note { margin-top: 16px; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-size: 13.5px; line-height: 1.5; color: var(--soft); }
.cf .note b { color: var(--text); }
.rep { width: 100%; border-collapse: collapse; font-size: 13px; }
.rep th { text-align: left; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--mute); padding: 4px 6px 4px 0; border-bottom: 1px solid var(--line-strong); }
.rep tbody th { text-align: left; font-size: 13px; font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--soft); padding: 6px 6px 6px 0; border-bottom: 1px solid var(--line); }
.rep td { padding: 6px 6px 6px 0; border-bottom: 1px solid var(--line); color: var(--soft); vertical-align: top; }
.rep td.v-improved { color: var(--ok-ink); font-weight: 600; }
.rep td.big { font: 600 18px var(--font-display); color: var(--text); }
.rep td.big.chg { color: var(--ok-ink); }
/* the export dialog */
#xdlg { position: absolute; inset: 0; z-index: 30; background: color-mix(in srgb, #05080f 66%, transparent); display: flex; align-items: center; justify-content: center; }
#xdlg[hidden] { display: none; }
#xdlg .dlg { width: 1080px; max-height: 800px; display: flex; flex-direction: column; border-radius: 16px; border: 1px solid var(--line-strong); background: var(--panel); box-shadow: 0 30px 80px rgba(0,0,0,.55); animation: dlgin var(--t-move) var(--ease-out); }
@keyframes dlgin { from { opacity: .4; transform: translateY(14px) scale(.985); } }
#xdlg .dh { display: flex; align-items: center; gap: 12px; padding: 18px 24px; border-bottom: 1px solid var(--line); }
#xdlg .dh h2 { margin: 0; font-family: var(--font-display); font-size: 22px; font-weight: 600; }
#xdlg .dh span { font-size: 13.5px; color: var(--mute); }
#xdlg .db { display: grid; grid-template-columns: 1.15fr 1fr; gap: 28px; padding: 18px 24px; overflow-y: auto; }
#xdlg fieldset { border: 0; margin: 0 0 14px; padding: 0; }
#xdlg legend, #xdlg .xlg { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); margin-bottom: 8px; padding: 0; display: block; }
#xdlg .xseg { display: flex; border: 1px solid var(--line-strong); border-radius: 9px; overflow: hidden; }
#xdlg .xseg label { flex: 1; display: grid; place-items: center; height: 36px; cursor: pointer; font-size: 14px; color: var(--soft); position: relative; }
#xdlg .xseg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
#xdlg .xseg label:has(input:checked) { background: var(--accent-fill); color: var(--on-accent); font-weight: 600; }
#xdlg .xseg label:has(input:focus-visible) { outline: 2px solid var(--focus); outline-offset: -3px; }
#xdlg .dhint { font-size: 12.5px; line-height: 1.45; color: var(--mute); margin: 6px 0 0; }
#xdlg select { width: 100%; height: 36px; border-radius: 9px; border: 1px solid var(--line-strong); background: var(--bg); color: var(--text); padding: 0 10px; font: inherit; font-size: 14px; }
#xdlg .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
#xdlg .three { display: grid; grid-template-columns: 1fr 1fr 1.2fr; gap: 10px; }
#xdlg .secs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px; font-size: 14px; color: var(--soft); }
#xdlg .secs label, #xdlg .fmt label { display: flex; gap: 8px; align-items: center; }
#xdlg .fmt { display: flex; gap: 16px; font-size: 14px; color: var(--soft); height: 36px; align-items: center; }
#xdlg input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent-fill); }
#xdlg .pages { display: flex; gap: 8px; flex-wrap: wrap; }
#xdlg .pg { width: 54px; height: 76px; border-radius: 3px; border: 1px solid var(--line-strong); background: var(--pg-paper, #fff); position: relative; overflow: hidden; }
#xdlg .pg.n { background: var(--pg-night, #0b0f19); }
#xdlg .pg i { position: absolute; left: 7px; right: 14px; top: 9px; height: 3px; border-radius: 2px; background: var(--pg-accent, #4338ca); }
#xdlg .pg.n i { background: var(--pg-accent-night, #a5b4fc); }
#xdlg .pg u { position: absolute; left: 7px; right: 7px; top: 18px; height: 2px; background: var(--pg-rule, #cbd5e1); }
#xdlg .pg s { position: absolute; left: 7px; right: 7px; bottom: 9px; height: 20px; border-radius: 2px; background: var(--pg-tint, #e7e9fd); }
#xdlg .pg.n s { background: var(--pg-night3, #1e293b); }
#xdlg .a11y { list-style: none; margin: 0; padding: 0; font-size: 13.5px; }
#xdlg .a11y li { display: grid; grid-template-columns: 18px 150px minmax(0, 1fr); gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); color: var(--soft); }
#xdlg .a11y li > span:first-child { color: var(--ok-ink); font-weight: 700; }
#xdlg .a11y li > span:nth-child(2) { color: var(--text); font-weight: 600; }
#xdlg .res { margin-top: 14px; border: 1px solid var(--ok-ink); border-radius: 10px; padding: 12px 14px; font-size: 13.5px; background: color-mix(in srgb, var(--ok) 6%, transparent); }
#xdlg .res[hidden] { display: none; }
#xdlg .res b { color: var(--ok-ink); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
#xdlg .res a { color: var(--accent-text); font-weight: 600; }
#xdlg .res code, #xdlg .cmd { display: block; margin-top: 8px; padding: 8px 10px; border-radius: 6px; background: var(--bg); font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 12px; line-height: 1.5; color: var(--soft); white-space: pre-wrap; word-break: break-all; user-select: all; }
#xdlg .df { display: flex; gap: 10px; align-items: center; justify-content: flex-end; padding: 14px 24px; border-top: 1px solid var(--line); }
#xdlg .df p { margin: 0 auto 0 0; font-size: 13px; color: var(--mute); }
#rpanel h3 .gw, .rtt h2 .gw { text-transform: inherit; letter-spacing: inherit; font-weight: inherit; color: inherit; font-size: inherit; }
#xdlg .px { width: 34px; height: 34px; border-radius: var(--radius); border: 1px solid var(--line-strong); background: none; color: var(--soft); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
#bar[hidden] { display: none; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="fit">
  <div id="top">
    <div class="hd" id="brandmark" style="flex:none;font-size:18px;font-weight:700;letter-spacing:.06em">AWA</div>
    <div style="width:1px;height:22px;background:color-mix(in srgb, var(--text) 16%, transparent)"></div>
    <nav id="crumbs" aria-label="Where you are" style="display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;flex:none"></nav>
    <nav id="levels" class="seg-ctl" aria-label="Heights and recommendations" style="flex:none"></nav>
    <div style="flex:1"></div>
    <button class="crumb gbtn" id="b-gloss" type="button" aria-expanded="false" aria-controls="gloss" title="What the words of this view mean (?)">Glossary <span class="kbd" aria-hidden="true">?</span></button>
    <div id="source" style="font-size:12px;color:var(--mute);white-space:nowrap;max-width:260px;min-width:0;flex:0 1000 auto;overflow:hidden;text-overflow:ellipsis"></div>
    <button class="crumb" id="b-open" style="border-color:color-mix(in srgb, var(--text) 16%, transparent)" title="Open a record: the file written by awa journey export, or by GET /api/v1/journeys/portfolio">Open a record</button>
    <input id="file" type="file" accept=".json,application/json" hidden>
    <div id="switch" class="seg-ctl" role="group" aria-label="Journey"></div>
    <button class="xbtn" id="b-export" type="button" aria-haspopup="dialog" aria-controls="xdlg" title="One document of the journeys, the work and what to change: HTML here, PDF and DOCX from the command line">Export dossier</button>
  </div>
  <div class="layer" id="L0"><div class="scene"></div></div>
  <div class="layer" id="L1"><div class="scene"></div></div>
  <div class="layer" id="L2"><div class="scene"></div></div>
  <div class="layer" id="L3"><div class="scene"></div></div>
  <div class="layer" id="LR" role="region" aria-label="Recommendations"><div class="scene"></div></div>
  <div id="bar">
    <div style="display:flex;gap:20px;align-items:flex-start;height:58px">
      <div id="when" class="mono" style="flex:none;width:150px;padding-top:4px;font-size:13px;color:var(--accent-text)"></div>
      <div id="cap" class="clamp2" aria-live="polite"></div>
      <div id="facts"></div>
    </div>
    <div style="display:flex;gap:10px;align-items:center">
      <button class="tb" id="b-start" aria-label="Back to the beginning"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14"/><path d="M19 5l-9 7 9 7z"/></svg></button>
      <button class="tb" id="b-prev" aria-label="One step back"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="tb pri" id="b-play" aria-label="Tell the story"></button>
      <button class="tb" id="b-next" aria-label="One step forward"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
      <button class="tb txt" id="b-pace" aria-label="Change the pace of the telling">1x</button>
      <input id="scrub" type="range" min="0" max="0" step="1" value="0" aria-label="Position in the story">
      <div id="count" class="mono" style="flex:none;width:76px;text-align:right;font-size:13px;color:var(--soft)"></div>
    </div>
  </div>
  <div id="none" hidden></div>
  <aside id="gloss" role="dialog" aria-modal="true" aria-labelledby="gloss-title" hidden>
    <div class="gloss-h">
      <div class="gloss-t"><h2 id="gloss-title">Glossary</h2><button class="gloss-x" id="gloss-close" type="button" aria-label="Close the glossary"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg></button></div>
      <div class="gloss-s"><input id="gq" type="search" autocomplete="off" spellcheck="false" aria-label="Search the glossary" aria-controls="glist"><span class="kbd" aria-hidden="true">/</span></div>
      <div class="gloss-c" id="gchips" role="group" aria-label="Show the terms of"></div>
    </div>
    <div id="glist" aria-live="polite"></div>
    <div class="gloss-f">AWA terms come with the view and cite the specification (docs/specification.md). Terms of this journey come from its options file (<code>glossary</code>).</div>
  </aside>
  <aside id="rpanel" aria-hidden="true"></aside>
  <div id="xdlg" hidden></div>
</div>
<script src="awa-brand.js"></script>
<script src="awa-glossary.js"></script>

<script src="awa-dossier.js"></script>
<script src="awa-dossier-html.js"></script>
<script src="journey-story-builder.js"></script>
<script src="journey-story.js"></script>
<script src="dashboard-sample.js"></script>
<script>
(() => {
'use strict';
let S = window.AWA_STORY;
const $ = id => document.getElementById(id);
const fit = () => { const k = Math.min(innerWidth / 1440, innerHeight / 900); $('fit').style.transform = `translate(${(innerWidth - 1440 * k) / 2}px, ${(innerHeight - 900 * k) / 2}px) scale(${k})`; };
addEventListener('resize', fit); fit();

const DAY = 86400000, r = Math.round;
/** A value from a record, made safe to stand inside a class name or an attribute */
const tok = s => String(s ?? '').replace(/[^A-Za-z0-9_-]/g, '');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const day = t => new Date(t).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', timeZone: 'UTC' });
const LEVELS = ['atlas', 'journey', 'story', 'run'];
const st = { level: 'atlas', j: 0, i: 0, r: 0, ip: 0, ia: 0, ib: 0, ic: 0, playing: false, fast: false, ox: 720, oy: 350 };
window.AWA_VIEW = st; // for tests and for deep links

const J = () => S.journeys[st.j];
const I = () => J().instances[Math.min(st.i, J().instances.length - 1)];
const R = () => I().runs[Math.min(st.r, I().runs.length - 1)];
const KEY = { atlas: 'ip', journey: 'ia', story: 'ib', run: 'ic' };
const count = () => st.level === 'atlas' ? S.customers.length : st.level === 'journey' ? J().all.length : st.level === 'story' ? I().beats.length : R().steps.length;
const pos = () => Math.min(st[KEY[st.level]], count() - 1);

// Mood in a word, a number and a colour
const moodWord = v => v === null || v === undefined ? '' : v >= 1.5 ? 'delighted' : v >= 0.5 ? 'pleased' : v > -0.5 ? 'neutral' : v > -1.5 ? 'unhappy' : 'upset';
const moodCls = v => v >= 1.5 ? 'm-up2' : v >= 0.5 ? 'm-up1' : v > -0.5 ? 'm-mid' : v > -1.5 ? 'm-dn1' : 'm-dn2';
const signed = v => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(Math.round(v * 10) / 10);
const mood = v => v === null || v === undefined ? '' : `<span class="${moodCls(v)}">${moodWord(v)} (${signed(v)})</span>`;
/** Whether the mood a journey ended on was stated by the customer or inferred by a rule */
const basisOf = inst => { let basis = ''; for (const b of inst.beats) for (const w of b.mood_why || []) basis = w.basis === 'measured' ? 'said' : 'inferred'; return basis; };
const KIND = k => k.charAt(0).toUpperCase() + k.slice(1);
/** A run's status in words: a host records "waiting_human" where a reader says "waiting for a person" */
const RUN_WORD = { completed: 'completed', failed: 'failed', cancelled: 'withdrawn', running: 'under way', waiting_human: 'waiting for a person', waiting_event: 'waiting for an event', waiting: 'waiting' };
const runWord = status => RUN_WORD[status] || String(status || '').replace(/_/g, ' ');

// ---------------------------------------------------------------- glossary
// AWA's terms come with the view (awa-glossary.js); a journey adds its own through the options ("glossary").
const GLOSSARY = window.AWA_GLOSSARY || { groups: [], terms: [] };
const fold = t => String(t ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
const slug = t => fold(t).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60);
/** The journey's own terms, from the options: data, never markup. A term or a definition that is not text is left out */
function journeyTerms() {
    const list = Array.isArray(OPTIONS.glossary) ? OPTIONS.glossary : [], seen = new Set(), out = [];
    for (const g of list.slice(0, 200)) {
        if (!g || typeof g.term !== 'string' || typeof g.definition !== 'string' || !g.term.trim() || !g.definition.trim()) continue;
        let id = slug(typeof g.id === 'string' && g.id ? g.id : g.term) || 'term';
        while (seen.has(id) || GLOSSARY.terms.some(t => t.id === id)) id += '-j';
        seen.add(id);
        out.push({ id, group: 'journey', term: g.term.trim().slice(0, 80), definition: g.definition.trim().slice(0, 500), see: typeof g.see === 'string' ? g.see.trim().slice(0, 300) : '',
            aliases: Array.isArray(g.aliases) ? g.aliases.filter(a => typeof a === 'string').map(a => a.slice(0, 80)).slice(0, 20) : [] });
    }
    return out;
}
const allTerms = () => [...journeyTerms(), ...GLOSSARY.terms];
/** The term a word of the view names: by id, by the term itself, or by one of its other names */
function termOf(word) {
    const w = fold(word), terms = allTerms();
    return terms.find(t => t.id === word) || terms.find(t => fold(t.term) === w) || terms.find(t => (t.aliases || []).some(a => fold(a) === w));
}
/** A word of the view, dotted when the glossary explains it: selecting it opens its entry. `focusable` false keeps it out of the tab order */
const word = (text, term, cls = '', focusable = true) => {
    const t = termOf(term || text);
    return t ? `<button type="button" class="gw ${cls}" data-term="${esc(t.id)}"${focusable ? '' : ' tabindex="-1"'} title="${esc(t.term)}: ${esc(t.definition)}">${esc(text)}</button>` : `<span class="${cls}">${esc(text)}</span>`;
};
/** The tag on an activity box, as a term of the glossary */
const TAG_TERM = { 'AI agent': 'ai-agent', Person: 'person', System: 'system', Robot: 'robot', 'Undo step': 'compensation', Decision: 'decision' };

// ---------------------------------------------------------------- geometry
const CX = k => 264 + k * 392;                       // atlas columns
// Atlas rows: 72 pixels apart, closer when more customers must fit above the caption
// A journey with many stages or several goals has a taller card: the rows start lower, and stay above the caption
const tallCard = () => S.journeys.some(j => j.stages.length > 7 || j.outcome.goals.length > 1);
const atlasTop = () => (tallCard() ? 272 : 236);
const rowGap = () => Math.min(72, Math.floor((464 - (atlasTop() - 236)) / Math.max(1, S.customers.length)));
const PY = i => atlasTop() + i * rowGap();
// Calendar lanes: 84 pixels apart, closer when more customers must fit above the caption
const laneGap = () => Math.min(84, Math.floor(520 / Math.max(1, J().instances.length)));
const laneTop = i => 178 + i * laneGap();
const laneMid = () => (laneGap() < 80 ? 32 : 34);
const LY = { world: 180, journey: 240, work: 300 };  // blueprint lanes
// Technology and exchange rows: 16 pixels apart, closer when there are many, so that the last stays above the legend
const rowH = () => Math.min(16, Math.floor(246 / Math.max(1, J().technologies.length + J().kinds.length - 1)));
const techY = k => 366 + k * rowH();
const kindY = (j, k) => 366 + j.technologies.length * rowH() + 28 + k * rowH();
const moodY = v => 100 - v * 14;
function xsOf(inst) {
    const w = b => 1 + (b.gap ? 1.5 : 0), beats = inst.beats;
    let units = 0; for (let i = 1; i < beats.length; i++) units += w(beats[i]);
    const unit = Math.min(64, 1170 / Math.max(units, 1)), xs = [218];
    for (let i = 1; i < beats.length; i++) xs.push(xs[i - 1] + unit * w(beats[i]));
    return xs.map(r);
}
function beatY(j, b) {
    if (b.lane !== 'tech') return LY[b.lane];
    const k = b.tp ? j.technologies.indexOf(b.tp.technology) : -1;
    return k >= 0 ? techY(k) : LY.journey;
}

// ---------------------------------------------------------------- scenes
const scenes = {};
const built = {};

scenes.atlas = () => {
    let h = `<div style="position:absolute;left:28px;top:20px;width:216px;display:flex;flex-direction:column;gap:8px">
      <div class="hd" style="font-size:22px;line-height:26px;font-weight:600">${S.journeys.length} journey${S.journeys.length === 1 ? '' : 's'}, ${S.customers.length} customer${S.customers.length === 1 ? '' : 's'}</div>
      <div class="sub" style="font-size:13px;line-height:18px">Select a journey to see everyone in it, or a cell to follow one customer through it. The line in each cell is that customer&rsquo;s mood: &ldquo;said&rdquo; where they told us, &ldquo;inferred&rdquo; where a rule assumed it.</div></div>`;
    S.journeys.forEach((j, k) => {
        const o = j.outcome;
        h += `<button class="jcard" style="left:${CX(k)}px;height:${atlasTop() - 40}px" data-open-j="${k}" aria-label="See everyone in the ${esc(j.name)} journey">
          <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px"><span class="hd" style="font-size:19px;font-weight:600;min-width:0">${esc(j.name)}</span><span style="font-size:12px;flex:none;max-width:88px;text-align:right">${o.mood === null ? '' : 'ends ' + mood(o.mood)}</span></div>
          <div class="sub ${tallCard() ? 'one' : 'clamp2'}" style="flex:none;height:${tallCard() ? 15 : 30}px">${esc(j.description)}</div>
          <div class="stg">${(j.stages.length > 7 ? j.stages.slice(0, 5) : j.stages).map(s => `<span>${esc(s.name)}</span>`).join('')}${j.stages.length > 7 ? `<span title="${esc(j.stages.slice(5).map(s => s.name).join(', '))}">+${j.stages.length - 5} more</span>` : ''}</div>
          <div class="kv"><div class="ct"><b>${o.completed}</b><span>completed</span></div><div class="ct${o.stalled ? ' warn' : ''}"><b>${o.stalled}</b><span>stalled</span></div><div class="ct"><b>${o.left}</b><span>left</span></div>
            ${o.goals.map(g => `<div class="ct"><b>${g.reached}/${j.instances.length}</b><span>${esc(g.name.toLowerCase())}</span></div>`).join('')}</div></button>`;
    });
    for (const t of S.transitions) if (t.to === t.from + 1) h += `<div class="hand" style="left:${CX(t.from) + 360}px">${t.count}<br><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15"/><path d="M14 7l5 5-5 5"/></svg><br>go on</div>`;
    const gap = rowGap(), tight = gap < 72, cellH = Math.min(58, gap - 6);
    S.customers.forEach((c, i) => {
        h += `<div class="prow" data-p="${i}" style="top:${PY(i) - 4}px${tight ? `;height:${cellH + 8}px` : ''}"></div>
          <div class="pname" style="top:${PY(i) + (tight ? Math.max(2, (cellH - 20) / 2 - (c.persona ? 8 : 0)) : 4)}px"><span style="font-size:15px;font-weight:600">${esc(c.name)}</span>${c.persona ? `<span class="sub ${tight ? 'one' : 'clamp2'}">${esc(c.persona)}</span>` : ''}</div>`;
        for (const life of c.life) {
            const inst = S.journeys[life.j].instances[life.i], sc = S.journeys[life.j].scale || { min: -2, max: 2 }, n = inst.beats.length;
            const pts = inst.beats.map((b, k) => `${r(4 + k / Math.max(n - 1, 1) * 142)},${r(20 - (b.mood ?? 0) / sc.max * 15)}`).join(' ');
            h += `<button class="pcell" style="left:${CX(life.j)}px;top:${PY(i)}px${tight ? `;height:${cellH}px` : ''}" data-open-s="${life.j},${life.i}" aria-label="Follow ${esc(c.name)} through ${esc(S.journeys[life.j].name)}">
              <svg class="spark" viewBox="0 0 150 40" aria-hidden="true"><line x1="0" y1="20" x2="150" y2="20" style="stroke:var(--edge)" stroke-dasharray="3 4"/><polyline points="${pts}" fill="none" style="stroke:var(--text)" stroke-width="2" stroke-linejoin="round"/></svg>
              <span style="display:flex;flex-direction:column;gap:2px;min-width:0"><span class="e-${tok(inst.ending.kind)}" style="font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(inst.ending.label)}</span><span style="font-size:12px">${mood(inst.mood_end)}${basisOf(inst) ? ` <span style="color:var(--mute)">&middot; ${basisOf(inst)}</span>` : ''}</span></span></button>`;
        }
    });
    return h;
};

scenes.journey = () => {
    const j = J(), w = r((1104 - (j.stages.length - 1) * 24) / j.stages.length);
    const ax = t => 264 + (Math.min(Math.max(t, j.t0), j.t1) - j.t0) / Math.max(j.t1 - j.t0, 1) * 1104;
    let h = `<div style="position:absolute;left:28px;top:22px;width:216px;display:flex;flex-direction:column;gap:8px">
      <div class="hd" style="font-size:22px;line-height:26px;font-weight:600">${esc(j.name)}</div>
      <div class="sub" style="font-size:13px;line-height:18px">Calendar time, ${day(j.t0)} to ${day(j.t1)}. One lane per customer. Select a lane to follow that customer.</div>
      <div id="asof" style="font-size:13px;font-weight:600;color:var(--accent-text)"></div></div>`;
    const narrow = w < 200;
    j.stages.forEach((s, k) => {
        h += narrow
            ? `<div class="card narrow" style="left:${264 + k * (w + 24)}px;width:${w}px"><div style="display:flex;flex-direction:column;gap:1px;min-width:0"><span class="hd" style="font-size:15px;line-height:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${esc(s.name)}">${esc(s.name)}</span><span class="sub" style="font-size:11px;line-height:14px">${s.max ? 'given ' + esc(s.max) : '&nbsp;'}</span></div>
          <div class="kv" data-card="${k}"></div></div>`
            : `<div class="card" style="left:${264 + k * (w + 24)}px;width:${w}px"><div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px"><span class="hd" style="font-size:17px;font-weight:600">${esc(s.name)}</span><span class="sub">${s.max ? 'given ' + esc(s.max) : ''}</span></div>
          <div class="kv" data-card="${k}"></div></div>`;
    });
    const span = j.t1 - j.t0, step = Math.max(1, Math.ceil(span / DAY / 10)) * DAY;
    for (let t = Math.floor(j.t0 / DAY) * DAY + DAY; t < j.t1; t += step) h += `<div class="tick" style="left:${r(ax(t))}px">${day(t)}</div>`;
    const MARK = { event: 1, timeout: 1, goal: 1, stalled: 1, completed: 1, abandoned: 1, run_failed: 1, model_decision: 1, human_done: 1 };
    const tight = laneGap() < 80, mid = laneMid();
    j.instances.forEach((c, i) => {
        const top = laneTop(i), stalledBeat = c.beats.find(b => b.kind === 'stalled');
        h += `<button class="lane" data-lane="${i}" style="top:${top}px${tight ? `;height:${laneGap() - 4}px;padding-top:7px` : ''}" aria-label="Follow the journey of ${esc(c.name)}"><span style="font-size:15px;font-weight:600">${esc(c.name)}</span><span class="ls"${tight ? ' style="-webkit-line-clamp:1"' : ''}>${esc(c.summary)}</span></button>`;
        c.stages.forEach(sg => { h += `<div class="seg st${sg.stage % 3}" data-from="${sg.from}" data-to="${sg.to === null ? j.t1 : sg.to}" data-open="${sg.to === null ? 1 : 0}" data-stall="${stalledBeat ? stalledBeat.t : ''}" data-name="${esc(j.stages[sg.stage].name)}" style="left:${r(ax(sg.from))}px;top:${top + mid - 12}px;width:0"></div>`; });
        c.beats.forEach(b => { if (MARK[b.kind]) h += `<div class="mk off" data-t="${b.t}" style="left:${r(ax(b.t))}px;top:${top + mid}px"><span class="sh k-${tok(b.kind)}"></span></div>`; });
        const kind = c.ending.kind, endT = kind === 'stalled' && stalledBeat ? stalledBeat.t : c.end, x = ax(endT), missed = c.goals.some(g => !g.reached);
        const txt = esc(c.ending.label) + (kind === 'completed' ? (missed ? ', a goal missed' : ', every goal reached') : '') + (c.mood_end === null ? '' : ' &middot; ' + mood(c.mood_end));
        h += `<div class="endl e-${tok(kind)}${x > 1000 ? ' rt' : ''} off" data-t="${kind === 'active' ? Infinity : endT}" style="left:${r(x)}px;top:${top + mid + (tight ? 13 : 18)}px">${txt}</div>`;
    });
    return h + `<div class="ph"><span class="phl"></span></div><div class="ring sm"></div>`;
};

scenes.story = () => {
    const j = J(), c = I(), beats = c.beats, n = beats.length, xs = xsOf(c), person = S.customers[c.c];
    const ys = beats.map(b => beatY(j, b));
    let h = `<div style="position:absolute;left:28px;top:12px;width:1384px;display:flex;align-items:center;gap:10px">
      <div class="hd" style="font-size:22px;font-weight:600;white-space:nowrap" title="${esc((person.persona || '') + ' ' + c.summary)}">${esc(c.name)}</div>
      <button class="crumb" style="border-color:color-mix(in srgb, var(--text) 16%, transparent);font-size:12px;height:28px;padding:0 9px" data-person="-1" title="The previous customer in this journey">&lsaquo; previous customer</button>
      <button class="crumb" style="border-color:color-mix(in srgb, var(--text) 16%, transparent);font-size:12px;height:28px;padding:0 9px" data-person="1" title="The next customer in this journey">next customer &rsaquo;</button>
      <button class="crumb" style="border-color:var(--focus);color:var(--text);font-size:12px;height:28px;padding:0 9px" data-list="toggle" title="The whole story as a dated list you can read from top to bottom">Read as a list</button>
<div style="flex:1 1 auto"></div>
      ${c.mood_from ? `<div class="chip" title="A journey begins at the mood the customer's last one left them in">Arrived ${mood(c.mood_start)} from ${esc(c.mood_from)}</div>` : ''}
      <div class="chip" id="moodchip"></div>
      ${c.goals.map((g, k) => `<div class="chip" data-goal="${k}"></div>`).join('')}
      <div class="chip e-${tok(c.ending.kind)} hide" id="endchip">${esc(c.ending.label)}</div></div>`;
    j.stages.forEach((sg, k) => {
        let first = -1, last = -1; beats.forEach((b, i) => { if (b.stage === k) { if (first < 0) first = i; last = i; } });
        if (first < 0) return;
        const x0 = first === 0 ? xs[0] - 30 : (xs[first - 1] + xs[first]) / 2 + 2, x1 = last === n - 1 ? xs[n - 1] + 30 : (xs[last] + xs[last + 1]) / 2 - 2;
        h += `<div class="band b${k % 2} off" data-b="${first}" style="left:${r(x0)}px;width:${r(x1 - x0)}px"></div>`
            + `<div class="bhd off" data-b="${first}" data-stage="${esc(sg.name)}" style="left:${r(x0)}px;width:${r(x1 - x0)}px"><span class="bhn">${esc(sg.name)}</span></div>`;
    });
    h += `<div class="col"></div>`;
    // Lane labels and rails. The journey itself is the line of visibility: customer above, work below.
    const label = (y, title, sub) => `<div class="ll" style="top:${y - 16}px"><div class="pt">${title}</div><div class="sub">${sub}</div></div>`;
    h += label(96, word('Mood', 'mood'), 'solid: said &middot; dashed: inferred') + label(LY.world, 'Customer', word('touchpoints', 'touchpoint')) + label(LY.journey, word('Journey', 'journey'), word('line of visibility', 'line-of-visibility')) + label(LY.work, word('Workflows', 'workflow'), 'the work behind it');
    h += `<div class="rail" style="top:${moodY(0)}px;border-top:1px dashed color-mix(in srgb, var(--text) 14%, transparent)"></div><div class="rail" style="top:${LY.world}px;border-top:1px dashed color-mix(in srgb, var(--text) 10%, transparent)"></div>
      <div class="rail" style="top:${LY.journey - 1}px;border-top:2px solid var(--stroke)"></div><div class="rail" style="top:${LY.work}px;border-top:1px dashed color-mix(in srgb, var(--text) 10%, transparent)"></div>
      <div class="rowl" style="top:${moodY(2) - 8}px;left:150px;width:auto;color:var(--ok-ink)">+2</div><div class="rowl" style="top:${moodY(-2) - 8}px;left:150px;width:auto;color:var(--bad-ink)">&minus;2</div>`;
    h += `<div class="ll" style="top:${techY(0) - 26}px"><div class="pt">${word('Technology', 'technology')}</div></div>`;
    j.technologies.forEach((t, k) => { h += `<div class="rowl" style="top:${techY(k) - 8}px" title="${esc(t)}">${esc(t)}</div><div class="rail" style="top:${techY(k)}px;border-top:1px solid color-mix(in srgb, var(--text) 5%, transparent)"></div>`; });
    h += `<div class="ll" style="top:${kindY(j, 0) - 26}px"><div class="pt">${word('Exchanged', 'artefact')}</div></div>`;
    j.kinds.forEach((t, k) => { h += `<div class="rowl" style="top:${kindY(j, k) - 8}px">${esc(KIND(t))}</div><div class="rail" style="top:${kindY(j, k)}px;border-top:1px solid color-mix(in srgb, var(--text) 5%, transparent)"></div>`; });

    // Mood: one line, revealed as the story is told. A filled dot was said by the customer; a hollow one was inferred.
    if (j.scale) {
        const pts = [[xs[0] - 22, moodY(c.mood_start ?? 0)], ...beats.map((b, i) => [xs[i], moodY(b.mood ?? 0)])];
        h += `<svg style="position:absolute;left:0;top:0;width:1440px;height:160px;overflow:visible;pointer-events:none" aria-hidden="true">`;
        beats.forEach((b, i) => {
            const why = b.mood_why || [], basis = why.length ? (why.some(w => w.basis === 'measured') ? ' said' : ' guess') : '';
            h += `<line class="ms${basis} off" data-b="${i}" x1="${pts[i][0]}" y1="${pts[i][1]}" x2="${pts[i + 1][0]}" y2="${pts[i + 1][1]}"/>`;
        });
        h += `</svg>`;
        beats.forEach((b, i) => {
            if (!b.mood_why) return;
            const said = b.mood_why.some(w => w.basis === 'measured');
            h += `<button class="md${said ? ' said' : ''} off" data-b="${i}" data-beat="${i}" style="left:${xs[i]}px;top:${moodY(b.mood)}px" title="${esc(b.mood_why.map(w => `${w.basis === 'measured' ? 'The customer said so' : 'Inferred by a rule'}: ${w.reason}`).join('; '))}" aria-label="Mood changes here: ${esc(b.mood_why.map(w => w.basis + ', ' + w.reason).join('; '))}"></button>`;
        });
    }
    c.runs.forEach((run, ri) => {
        h += `<button class="rb off" data-run="${ri}" data-b0="${run.b0}" data-b1="${run.b1}" data-status="${tok(run.status)}" style="left:${xs[run.b0] - 18}px;top:${LY.work}px;width:${xs[run.b1] - xs[run.b0] + 36}px" aria-label="Look inside the run of ${esc(run.name)}"></button>
          <button class="rbl off" data-b="${run.b0}" data-run="${ri}" data-runlabel="${ri}" style="left:${xs[run.b0] - 16}px;top:${LY.work + 25}px;max-width:${(c.runs[ri + 1] ? xs[c.runs[ri + 1].b0] : 1420) - xs[run.b0] - 6}px"></button>`;
    });
    for (let i = 1; i < n; i++) {
        const b = beats[i], y0 = ys[i - 1], y1 = ys[i], time = b.outside ? ' time' : '';

$('LR').addEventListener('keydown', e => {

        if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && e.target.closest('#rcards')) {
            const cs = [...document.querySelectorAll('#rcards .rcard')], i = cs.indexOf(document.activeElement); if (i < 0) return;
            e.preventDefault(); cs[(i + (e.key === 'ArrowDown' ? 1 : cs.length - 1)) % cs.length].focus();
        }
        return;
    }
    const shown = RS.marks.filter(m => !m.el.hidden); if (!shown.length) return;
    const cur = shown.find(m => m.el === document.activeElement) || shown[0], order = shown.slice().sort((a, b) => a.r.rank - b.r.rank);
    let next = null;
    const dir = { ArrowRight: [1, 0], ArrowLeft: [-1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
    if (dir) {
        let best = 1e9;
        for (const m of shown) {
            if (m === cur) continue;
            const dx = m.tx - cur.tx, dy = m.ty - cur.ty, along = dx * dir[0] + dy * dir[1];
            if (along <= 2) continue;
            const d = along + Math.abs(dx * dir[1] + dy * dir[0]) * 2;
            if (d < best) { best = d; next = m; }
        }
        if (!next) { const i = order.indexOf(cur); next = order[(i + (dir[0] + dir[1] > 0 ? 1 : order.length - 1)) % order.length]; }
    } else if (e.key === 'Home') next = order[0];
    else if (e.key === 'End') next = order[order.length - 1];
    else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openRec(cur.r.id, cur.el); return; }
    if (next) { e.preventDefault(); e.stopPropagation(); shown.forEach(m => { m.el.tabIndex = -1; }); next.el.tabIndex = 0; next.el.focus(); }
});
$('rpanel').addEventListener('click', e => {
    const hit = sel => e.target.closest(sel);
    let x;
    if (hit('#rp-close')) return closeRec();
    if ((x = hit('[data-rafter]'))) return toggleAfter(x.dataset.rafter === '1');
    if (hit('[data-rcf]')) { RS.cf = !RS.cf; RS.after = false; render(); if (RS.cf) setTimeout(() => toggleAfter(true), still() ? 0 : 120); const c = $('rp-close'); if (c) c.focus({ preventScroll: true }); return; }
    if ((x = hit('[data-rgo]'))) return goTo(x.dataset.rgo, x.dataset);
    if ((x = hit('[data-ract]'))) {
        const v = viewer(), id = RS.open;
        if (x.dataset.ract === 'dossier') v.dossier = v.dossier.includes(id) ? v.dossier.filter(y => y !== id) : [...v.dossier, id];
        else v.status[id] = v.status[id] === 'accepted' ? undefined : 'accepted';
        keep(v); render(); const again = document.querySelector(`#rpanel [data-ract="${x.dataset.ract}"]`); if (again) again.focus({ preventScroll: true });
    }
});
$('rpanel').addEventListener('change', e => {
    if (e.target.id !== 'rp-reason') return;
    const v = viewer(); v.status[RS.open] = e.target.value ? 'dismissed: ' + e.target.value.toLowerCase() : undefined; keep(v); render();
    const s = $('rp-reason'); if (s) s.focus({ preventScroll: true });
});
/** Keys of the tab: Escape closes the panel (or the before and after) and gives the focus back; T toggles before and after */
function recKey(e) {
    if (xdlgOpen()) return xKey(e);
    if (!st.recs) return false;
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
    if (e.key === 'Escape') { e.preventDefault(); if (RS.cf) { RS.cf = false; RS.after = false; render(); const c = $('rp-close'); if (c) c.focus(); } else closeRec(); return true; }
    if ((e.key === 't' || e.key === 'T') && RS.open && !typing && !e.ctrlKey && !e.metaKey) {
        const r = recById(RS.open);
        if (r && r.detail && r.effect.method === 'replay' && !RS.cf) { RS.cf = true; RS.after = false; render(); setTimeout(() => toggleAfter(true), still() ? 0 : 60); }
        else toggleAfter();
        e.preventDefault(); return true;
    }
    return true;                                                   // the arrows of the story do not move behind the tab
}

/** The heights and the tab, from the bar: down into the thing in view, up as Escape goes */
function gotoLevel(lv) {
    if (lv === 'recs') { if (!st.recs) { st.recs = true; RS.open = null; RS.cf = false; render(); } return; }
    const was = st.recs; st.recs = false; RS.open = null; RS.cf = false;
    const from = LEVELS.indexOf(st.level), to = LEVELS.indexOf(lv);
    if (to === from) return render();
    if (to < from) return was ? set({ level: lv }) : goLevel(lv);
    if (lv === 'journey') return openJourney(st.j);
    if (lv === 'story') return openStory(st.j, st.i);
    if (lv === 'run') { if (!I().runs.length) return render(); return st.level === 'story' ? openRun(Math.min(st.r, I().runs.length - 1)) : set({ level: 'run', r: Math.min(st.r, I().runs.length - 1), ic: 0 }); }
}

// ---------------------------------------------------------------- the export dialog (design board ExportDialog)
// In the browser it makes the HTML edition directly, offered as a link; the PDF and the DOCX come from the command line.
let lastBrand = null, xOpener = null, xUrl = null;
const xdlgOpen = () => !$('xdlg').hidden;
const SECTIONS = [['summary', 'Summary', '1 p.'], ['glance', 'The journey at a glance', '1 p.'], ['voices', 'In their own words', '4 p.'], ['work', 'The work behind the journey', '1 p.'], ['analysis', 'Analysis', '2–3 p.'], ['recs', 'Recommendations', '1–2 p.'], ['appendix', 'Compliance and evidence', '1–2 p.'], ['glossary', 'Glossary, method, sources', '1 p.']];
function openExport(from) {

    x.innerHTML = `<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="xd-h" aria-describedby="xd-d">

      <div class="db"><div>
