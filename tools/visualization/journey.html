        <fieldset><legend>Scope</legend><div class="two">
          <label><span class="vh" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Journey</span><select id="xd-j">${S.journeys.map((jj, k) => `<option value="${k}"${k === st.j ? ' selected' : ''}>Journey: ${esc(jj.name)}</option>`).join('')}</select></label>
          <label><span class="vh" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Customers</span><select id="xd-c"><option value="">Customers: all ${inst.length}</option>${inst.map(c => `<option value="${esc(c.id)}">${esc(c.name)} only</option>`).join('')}</select></label>
          <span class="rsel" style="display:flex;align-items:center;font-size:14px;color:var(--soft)">Period: ${esc(periodText())}</span>
          <span class="rsel" style="display:flex;align-items:center;font-size:14px;color:var(--soft)">Workflows: all ${S.workflows.length}</span></div></fieldset>
        <fieldset><legend>Sections</legend><div class="secs">${SECTIONS.map(([id, name, pp]) => `<label><input type="checkbox" data-xsec="${id}" checked>${esc(name)} <span style="margin-left:auto;color:var(--mute)">${pp}</span></label>`).join('')}</div></fieldset>
        <div class="three">
          <fieldset><legend>Brand</legend><select id="xd-b"><option value="view">${esc(lastBrand ? lastBrand.name || 'This brand' : 'AWA (default)')}</option>${lastBrand ? '<option value="awa">AWA</option>' : ''}</select></fieldset>
          <fieldset><legend>Language</legend><select id="xd-l"><option>English</option></select></fieldset>
          <fieldset><legend>Format</legend><div class="fmt"><label><input type="checkbox" data-xfmt="html" checked>HTML</label><label><input type="checkbox" data-xfmt="pdf" checked>PDF</label><label><input type="checkbox" data-xfmt="docx" checked>DOCX</label></div></fieldset>
        </div>
        <fieldset><legend>Personas</legend><p class="dhint" id="xd-p" style="margin:0">The narrator picks the most different journeys: one that went the whole way, and one that is stuck. The journey’s options can name others (dossier.personas).</p></fieldset>
      </div><div>
        <span class="xlg" id="xd-prev">Preview</span><div class="pages" id="xd-pages" aria-hidden="true"></div>
        <span class="xlg" style="margin-top:16px">Accessibility check, before export</span><ul class="a11y" id="xd-a11y"></ul>
        <div class="res" id="xd-res" hidden role="status"></div>
      </div></div>
      <div class="df"><p>A person approves before the dossier is issued (separation of duties: not the one who exported it).</p><button type="button" class="ebtn" id="xd-cancel">Cancel</button><button type="button" class="ebtn pri" id="xd-go"${canBuild ? '' : ' aria-describedby="xd-why"'}>Export and ask for approval</button></div>
    </div>`;

}
function xSettings() {
    const aud = (document.querySelector('#xdlg input[name="xaud"]:checked') || {}).value || 'professional';
    const pick = $('xd-c').value, jj = S.journeys[+$('xd-j').value] || J();
    const customer = aud === 'client' ? (pick || (jj.instances[0] || {}).id) : null;
    return { edition: aud, customer, journey: +$('xd-j').value, sections: [...document.querySelectorAll('#xdlg [data-xsec]:checked')].map(c => c.dataset.xsec), formats: [...document.querySelectorAll('#xdlg [data-xfmt]:checked')].map(c => c.dataset.xfmt), brand: $('xd-b').value };
}
/** The dossier as the settings say: its model, or null when the view holds no record */
function xModel(s) {
    if (!RECORD || !window.AWA_DOSSIER) return null;
    const jk = RECORD.journeys.findIndex(x => x.definition.name === S.journeys[s.journey].name);
    return window.AWA_DOSSIER.build(RECORD, OPTIONS, { edition: s.edition, customer: s.customer, journey: Math.max(0, jk), recommendations: RECS || undefined, source: query.get('data') || $('source').textContent || null });
}
function xPreview() {

    let m = null, problem = '';

    $('xd-prev').textContent = `Preview${m ? ` · ${m.personas.map(p => p.name).join(' and ')}` : ''}`;

    const pair = theme ? Math.min(D.contrast(theme.ink3, theme.paper), D.contrast(theme.wait, theme.paper), D.contrast(theme.accent, theme.paper)).toFixed(2) : '';
    const checks = m ? [
        ['Headings in order', `${m.contents.length} chapters, no level skipped`],
        ['Figures with alternatives', 'every chart has alt text, a summary and its table'],
        ['Tables with headers', 'header cells with scope; header rows repeat in the PDF and the DOCX'],
        ['Contrast', `lowest text pair ${pair}:1 on paper`],

    $('xd-a11y').innerHTML = checks.map(([a, b]) => `<li><span aria-hidden="true">✓</span><span>${esc(a)}</span><span>${esc(b)}</span></li>`).join('') + (m ? '' : `<li><span aria-hidden="true">!</span><span>No record here</span><span id="xd-why">${esc(problem || 'This view was given a prepared story, not its record. Make the dossier from the record with the command line.')}</span></li>`);
}
function xCommands(s) {
    const data = query.get('data') || '<journeys.json>', opts = query.get('options');
    const args = `--edition ${s.edition}${s.customer ? ` --customer ${s.customer}` : ''}`;
    const other = s.formats.filter(f => f !== 'html').join(',') || 'pdf,docx';
    return [`awa dossier --file ${data}${opts ? ` --options ${opts}` : ''} ${args} --format ${other} --out dossier`, `node tools/dossier/dossier.mjs --record ${data}${opts ? ` --options ${opts}` : ''} ${args} --format ${other} --out dossier`];
}
function xExport() {
    const s = xSettings(), res = $('xd-res');
    let m = null;
    try { m = xModel(s); } catch (error) { res.hidden = false; res.textContent = `The dossier could not be made: ${error.message}`; return; }
    const cmds = xCommands(s);
    if (xUrl) { try { URL.revokeObjectURL(xUrl); } catch { /* nothing to free */ } xUrl = null; }
    let link = '';
    if (m && s.formats.includes('html')) {
        const html = window.AWA_DOSSIER_HTML.render(m, { theme: window.AWA_DOSSIER.theme(s.brand === 'view' && lastBrand && !/^https?:/.test(lastBrand.logo || '') ? lastBrand : (s.brand === 'view' && lastBrand ? { ...lastBrand, logo: '' } : null)), sections: s.sections });
        try { xUrl = URL.createObjectURL(new Blob([html], { type: 'text/html' })); } catch { xUrl = null; }
        const name = `${m.meta.journey.toLowerCase().replace(/[^a-z0-9]+/g, '-')}.${m.edition}.html`;
        link = xUrl ? `<p style="margin:8px 0 0"><a href="${xUrl}" download="${esc(name)}" target="_blank" rel="noopener" id="xd-link">Open the HTML edition</a> · ${esc(name)}, ${(html.length / 1024).toFixed(0)} kB, one file that works offline</p>` : '<p>This page cannot offer a file here. Use the command below.</p>';
        window.AWA_last_dossier = html;                                    // for tests and for a page that embeds the view
    }
    res.hidden = false;
    res.innerHTML = `<b>${m ? 'Made, awaiting approval' : 'Make it from the record'}</b>${link}<p style="margin:10px 0 0">PDF and DOCX, from the command line:</p><code>${esc(cmds[0])}</code><code>${esc(cmds[1])}</code><p class="dhint">The dossier workflow (tools/dossier/dossier.awa.json) has a person approve it before it is issued; its run is journalled.</p>`;
    const l = $('xd-link'); (l || res).focus && (l || $('xd-go')).focus({ preventScroll: true });
}
function closeExport() { const x = $('xdlg'); if (x.hidden) return; x.hidden = true; x.innerHTML = ''; if (xOpener && xOpener.isConnected) xOpener.focus({ preventScroll: true }); xOpener = null; }
/** The dialog's keys: Escape closes it, Tab stays inside it */
function xKey(e) {
    if (e.key === 'Escape') { e.preventDefault(); closeExport(); return true; }
    if (e.key === 'Tab') {
        const stops = [...$('xdlg').querySelectorAll('button, input, select, a[href]')].filter(n => !n.disabled && n.offsetParent !== null);
        if (!stops.length) return true;
        const i = stops.indexOf(document.activeElement);
        if (e.shiftKey && i <= 0) { e.preventDefault(); stops[stops.length - 1].focus(); }
        else if (!e.shiftKey && (i === stops.length - 1 || i < 0)) { e.preventDefault(); stops[0].focus(); }
        return true;
    }
    return true;                                                   // nothing behind the dialog moves
}
$('xdlg').addEventListener('click', e => {
    if (e.target === $('xdlg') || e.target.closest('#xd-x') || e.target.closest('#xd-cancel')) return closeExport();
    if (e.target.closest('#xd-go')) return xExport();
});
$('xdlg').addEventListener('change', () => { xPreview(); $('xd-res').hidden = true; });
window.AWA_export = { open: openExport, close: closeExport, export: () => xExport() };
})();
